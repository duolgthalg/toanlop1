<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bé học toán lớp 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFDFF; --grid:#E4EDF9; --grid-strong:#C6D8F0;
    --ink:#1E3A8A; --ink-soft:#5468A3; --red:#D6342C; --sun:#FFC83D;
    --leaf:#2F9E5B; --sky:#3B82C4; --white:#FFFFFF;
    --font:"Baloo 2","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font); color:var(--ink); font-size:20px; line-height:1.4; min-height:100vh;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px);
    background-size:40px 40px, 40px 40px, 40px 10px;
  }
  #app{max-width:800px; margin:0 auto; padding:20px 16px 64px}
  button,input,select{font-family:inherit; color:inherit}
  button{cursor:pointer}
  button:disabled{cursor:not-allowed}
  button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:4px solid var(--sun); outline-offset:3px}

  h1{font-size:44px; line-height:1.1; margin:8px 0 4px; font-weight:800}
  h2{font-size:28px; line-height:1.2; margin:0 0 12px; font-weight:800}
  h3{font-size:21px; margin:18px 0 8px}
  .phu{color:var(--ink-soft); margin:0 0 20px}
  .nho{font-size:16px; color:var(--ink-soft)}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; min-height:44px; flex-wrap:wrap}
  .btn{border:3px solid var(--ink); background:var(--white); border-radius:14px; padding:8px 18px; font-size:19px; font-weight:700; box-shadow:0 4px 0 var(--ink); transition:transform .08s, box-shadow .08s}
  .btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
  .btn:disabled{opacity:.45; box-shadow:none}
  .btn-chinh{background:var(--sun)}
  .btn-nho{font-size:16px; padding:5px 12px; box-shadow:0 3px 0 var(--ink); border-radius:12px}
  .btn-chu{border:none; background:none; box-shadow:none; padding:6px 4px; text-decoration:underline; font-weight:600; font-size:16px; color:var(--ink-soft)}
  .btn-nguy{border-color:var(--red); color:var(--red); box-shadow:0 3px 0 var(--red)}
  select{font-size:18px; padding:4px 10px; border:3px solid var(--ink); border-radius:12px; background:var(--white); color:var(--ink); max-width:100%}

  /* Trang chào */
  .hero{margin:12px 0 28px}
  .hero-so{font-size:72px; font-weight:800; line-height:1; letter-spacing:4px}
  .ds-ho-so{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:24px}
  .the-ten{display:flex; flex-direction:column; align-items:flex-start; min-width:150px; padding:12px 20px; background:var(--white); border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink); text-align:left}
  .the-ten .ten{font-size:28px; font-weight:800; line-height:1.1}
  .them label{display:block; font-weight:700; margin-bottom:6px}
  .hang{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .hang input{flex:1; min-width:180px; font-size:22px; padding:8px 14px; border:3px solid var(--ink); border-radius:14px; background:var(--white)}

  /* Bản đồ chặng */
  .chang-list{list-style:none; padding:0; margin:0; position:relative}
  .chang-list::before{content:""; position:absolute; left:50px; top:30px; bottom:30px; border-left:5px dashed var(--grid-strong)}
  .chang{position:relative; display:flex; align-items:center; gap:18px; width:100%; background:var(--white); border:3px solid var(--ink); border-radius:22px; padding:14px 18px; margin-bottom:20px; text-align:left; box-shadow:0 5px 0 var(--ink)}
  .chang .tron{flex:none; width:60px; height:60px; border-radius:50%; display:grid; place-items:center; font-size:32px; font-weight:800; border:3px solid var(--ink); background:var(--c)}
  .chang .ten{display:block; font-size:25px; font-weight:800; line-height:1.15}
  .chang .pham-vi{display:block; font-size:18px; color:var(--ink-soft)}
  .chang .trang-thai{margin-left:auto; font-size:16px; font-weight:700; text-align:right}
  .chang.qua .trang-thai{color:var(--leaf)}
  .chang:disabled{opacity:.55; box-shadow:none}

  /* Độ khó */
  .do-kho{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 6px}
  .do-kho .nhan{font-weight:700; margin-right:4px}
  .pill{border:3px solid var(--c); background:var(--white); color:var(--ink); border-radius:999px; padding:3px 16px; font-size:18px; font-weight:700}
  .pill[aria-pressed="true"]{background:var(--c); color:var(--t)}
  .mo-ta-dk{font-size:16px; color:var(--ink-soft); margin:0 0 20px}
  .the-dk{display:inline-block; font-size:14px; font-weight:700; padding:0 10px; border-radius:999px; background:var(--c); color:var(--t); line-height:1.6; vertical-align:middle}
  .cham-dk{display:flex; gap:5px; margin-top:4px}
  .cham-dk i{display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid var(--grid-strong)}
  .cham-dk i.co{background:var(--c); border-color:var(--c)}

  /* Danh sách bài */
  .luoi-bai{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px}
  .bai{display:flex; flex-direction:column; gap:2px; min-height:128px; padding:12px 14px; background:var(--white); border:3px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 var(--ink); text-align:left}
  .bai .so{font-size:15px; font-weight:700; color:var(--ink-soft)}
  .bai .ten{font-size:19px; font-weight:800; line-height:1.2}
  .bai .sao{margin-top:auto; font-size:22px; color:#E8A600; letter-spacing:1px; min-height:28px}
  .bai .sao small{font-size:15px; color:var(--ink-soft); letter-spacing:0}
  .sao-mo{color:var(--grid-strong)}
  .bai:disabled{opacity:.5; box-shadow:none}
  .kiem-tra{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; margin-top:24px; padding:18px 20px; background:#FFF7DD; border:3px solid var(--ink); border-radius:20px}
  .kiem-tra > div{flex:1; min-width:240px}
  .kiem-tra p{margin:0 0 4px}
  .on-tap{background:#EAF4FF}

  /* Làm bài */
  .tien-do{display:flex; align-items:center; gap:12px; margin-bottom:12px; font-weight:700; font-size:18px}
  .thanh{flex:1; height:16px; border:3px solid var(--ink); border-radius:10px; background:var(--white); overflow:hidden}
  .thanh > span{display:block; height:100%; background:var(--leaf); transition:width .3s}
  .dung-dem{color:var(--leaf)}
  .dong-ho{display:flex; align-items:center; gap:10px; margin:0 0 16px; font-weight:700}
  .dong-ho .khung{flex:1; height:22px; border:3px solid var(--ink); border-radius:12px; background:var(--white); overflow:hidden}
  .dong-ho .vach{display:block; height:100%; width:100%; background:var(--sun)}
  .dong-ho .so-giay{min-width:64px; text-align:right; font-size:26px; font-weight:800}
  .dong-ho.cho{opacity:.55}
  .dong-ho.gap .vach{background:var(--red)}
  .dong-ho.gap .so-giay{color:var(--red)}
  .cau{position:relative; background:var(--white); border:3px solid var(--ink); border-radius:26px; padding:44px 20px 30px; text-align:center; margin-bottom:22px}
  .cau .de{font-size:26px; font-weight:700; margin:0}
  .cau .bieu-thuc{font-size:68px; font-weight:800; line-height:1.1; margin:12px 0 0; letter-spacing:2px; white-space:nowrap}
  .o{display:inline-block; min-width:1.15em; padding:0 .12em; border:4px dashed var(--red); border-radius:14px; color:var(--red); line-height:1.05}
  .o.da-dien{border-style:solid; border-color:var(--leaf); color:var(--leaf)}
  .o-nho{display:inline-block; min-width:1.4em; text-align:center; border:2px dashed var(--red); border-radius:6px; color:var(--red); line-height:1.2}
  .nut-doc{position:absolute; top:12px; right:12px}
  .dap-an{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .dap-an.ba{grid-template-columns:repeat(3,1fr)}
  .lua-chon{font-size:50px; font-weight:800; padding:14px 8px; background:var(--white); border:4px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink); transition:transform .08s, box-shadow .08s}
  .lua-chon:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
  .lua-chon:disabled{cursor:default}
  .lua-chon.dung{background:var(--leaf); border-color:var(--leaf); color:var(--white); box-shadow:0 6px 0 #1F6E3F}
  .lua-chon.sai{background:var(--red); border-color:var(--red); color:var(--white); box-shadow:0 6px 0 #8E1F19}
  .ban-phim{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:420px; margin:0 auto}
  .ban-phim button{font-size:36px; font-weight:800; padding:6px; background:var(--white); border:3px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 var(--ink)}
  .ban-phim button:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
  .ban-phim .xong{background:var(--sun); font-size:26px}
  .ban-phim button:disabled{opacity:.5; box-shadow:none}
  .goi-y{text-align:center; margin-top:20px; font-size:24px; font-weight:700; min-height:40px}
  .goi-y .btn{margin-top:10px}

  /* Kết quả */
  .ket-qua{text-align:center; background:var(--white); border:3px solid var(--ink); border-radius:26px; padding:28px 20px}
  .diem-khung{display:inline-flex; align-items:baseline; gap:4px; margin:6px 0 10px; padding:6px 30px; border:5px solid var(--red); border-radius:50%; color:var(--red); transform:rotate(-6deg); animation:dong-dau .45s cubic-bezier(.2,1.6,.4,1) both}
  .diem{font-size:92px; font-weight:800; line-height:1}
  .tren{font-size:36px; font-weight:700}
  @keyframes dong-dau{from{transform:rotate(-20deg) scale(2); opacity:0} to{transform:rotate(-6deg) scale(1); opacity:1}}
  .sao-to{font-size:52px; color:#E8A600; line-height:1}
  .nut-hang{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:20px}
  .ket-qua details{margin-top:22px; text-align:left; font-size:18px}
  summary{cursor:pointer; font-weight:700}
  .ket-qua details ul{padding-left:22px}

  /* Phụ huynh */
  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 18px}
  .tab{border:3px solid var(--ink); background:var(--white); border-radius:999px; padding:4px 16px; font-size:18px; font-weight:700}
  .tab[aria-selected="true"]{background:var(--ink); color:var(--white)}
  .khoi{background:var(--white); border:3px solid var(--ink); border-radius:18px; padding:16px 18px; margin-bottom:18px}
  .khoi p{margin:0 0 10px}
  .khoi h3:first-child{margin-top:0}
  .cuon{overflow-x:auto}
  table{border-collapse:collapse; width:100%; font-size:17px}
  th,td{border:2px solid var(--grid-strong); padding:6px 10px; text-align:left; vertical-align:top}
  th{background:#EEF4FC}
  .chon-o{display:flex; align-items:center; gap:10px; margin:8px 0; font-size:19px}
  .chon-o input{width:22px; height:22px; flex:none}
  .dong-cai{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:10px 0}
  .dong-cai > label{font-weight:700; min-width:150px}
  .o-so{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px}
  .o-so div{border:3px solid var(--ink); border-radius:16px; padding:10px 14px; background:#F7FAFF}
  .o-so b{display:block; font-size:30px; line-height:1.15}
  .o-so span{font-size:15px; color:var(--ink-soft)}
  .cot{display:grid; grid-template-columns:minmax(120px,170px) 1fr 110px; align-items:center; gap:10px; font-size:17px; margin:7px 0}
  .cot .nen{height:16px; border:2px solid var(--ink); border-radius:8px; overflow:hidden; background:#F3F7FD}
  .cot .nen span{display:block; height:100%}
  .cot .so{text-align:right; font-weight:700}
  .yeu{color:var(--red); font-weight:700; font-size:15px}
  .bieu-do{display:flex; align-items:flex-end; gap:6px; height:150px; border-bottom:3px solid var(--ink)}
  .bieu-do .c{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%}
  .bieu-do .c em{font-style:normal; font-size:13px; font-weight:700}
  .bieu-do .c span{width:100%; max-width:34px; background:var(--sky); border-radius:6px 6px 0 0}
  .nhan-ngay{display:flex; gap:6px; margin-top:4px}
  .nhan-ngay span{flex:1; text-align:center; font-size:12px; color:var(--ink-soft)}
  .huy-hieu{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
  .huy-hieu div{border:3px solid var(--ink); border-radius:16px; padding:10px; text-align:center; background:#FFFBEA; font-size:16px; font-weight:700; line-height:1.25}
  .huy-hieu .bh{font-size:36px; display:block; line-height:1.2}
  .huy-hieu small{display:block; font-weight:500; color:var(--ink-soft); font-size:14px; margin-top:4px}
  .huy-hieu .chua{opacity:.4; filter:grayscale(1); border-style:dashed; background:var(--white)}
  .loc{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:12px}
  .dong-ls{border:2px solid var(--grid-strong); border-radius:12px; padding:8px 12px; margin-bottom:8px; background:var(--white)}
  .dong-ls summary{display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; font-weight:500; font-size:17px}
  .dong-ls .ct{padding:8px 4px 2px; font-size:17px}
  .dong-ls ul{margin:4px 0 10px; padding-left:22px}
  .dat{color:var(--leaf); font-weight:800}
  .chua-dat{color:var(--red); font-weight:800}

  .canh-bao{background:var(--red); color:var(--white); padding:10px 16px; text-align:center; font-size:17px; font-weight:700}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--white); padding:10px 20px; border-radius:14px; font-size:18px; font-weight:700; z-index:10; max-width:90vw; text-align:center}

  @media (max-width:540px){
    h1{font-size:34px}
    .hero-so{font-size:52px}
    .cau .bieu-thuc{font-size:46px}
    .lua-chon{font-size:38px}
    .dap-an{gap:12px}
    .chang .trang-thai{font-size:14px}
    .cot{grid-template-columns:110px 1fr 80px; font-size:15px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important}
  }
</style>
</head>
<body>
<div id="canhBao" class="canh-bao" hidden></div>
<main id="app"></main>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="fileNhap" accept=".json,application/json" hidden>

<script>
/* =========================================================
   1. CẤU HÌNH — muốn đổi luật chỉ cần sửa ở đây
   ========================================================= */
const CONFIG = {
  soCauBai: 10,          // số câu mỗi bài
  diemDatBai: 8,         // đúng bao nhiêu câu thì mở bài tiếp theo
  soCauKiemTra: 30,      // số câu bài kiểm tra
  diemDatKiemTra: 28,    // đúng bao nhiêu câu thì lên giai đoạn
  soCauOn: 10,           // số câu mỗi lượt ôn câu sai
  thoiGianBai: 20,       // giây cho mỗi câu ở bài tập thường (0 = không tính giờ)
  thoiGianKiemTra: 15,   // giây cho mỗi câu ở bài kiểm tra
  thoiGianOn: 20,        // giây cho mỗi câu khi ôn câu sai
  giaiDoan: {
    1: { min: 0, max: 10,  khongNho: false, mau: "#FFC83D" },
    2: { min: 1, max: 20,  khongNho: true,  mau: "#86D69A" },
    3: { min: 1, max: 50,  khongNho: true,  mau: "#93C8F2" },
    4: { min: 1, max: 100, khongNho: true,  mau: "#F6A9A5" }
  },
  doKho: {
    1: { ten: "Dễ",         mau: "#2F9E5B", chu: "#FFFFFF", moTa: "Số nhỏ, các số cách xa nhau, 3 lựa chọn." },
    2: { ten: "Trung bình", mau: "#F2B400", chu: "#1E3A8A", moTa: "Đủ phạm vi số, 4 lựa chọn." },
    3: { ten: "Khó",        mau: "#E0701F", chu: "#FFFFFF", moTa: "Số lớn, các số rất gần nhau, đáp án nhiễu dễ nhầm." },
    4: { ten: "Rất khó",    mau: "#D6342C", chu: "#FFFFFF", moTa: "Số lớn và dễ nhầm, bé tự bấm số để trả lời." }
  },
  baiHoc: [
    { ten: "Số liền sau",            dang: ["lienSau"] },
    { ten: "Số liền trước",          dang: ["lienTruoc"] },
    { ten: "Lớn hơn, bé hơn",        dang: ["lonHon", "beHon"] },
    { ten: "Điền dấu > < =",         dang: ["dienDau"] },
    { ten: "Phép cộng",              dang: ["cong"] },
    { ten: "Cộng: tìm số còn thiếu", dang: ["cong", "congThieuSo"] },
    { ten: "Phép trừ",               dang: ["tru"] },
    { ten: "Trừ: tìm số còn thiếu",  dang: ["tru", "truThieuSo"] },
    { ten: "Cộng trừ xen kẽ",        dang: ["cong", "tru", "soSanhPhepTinh"] },
    { ten: "Ôn tập tổng hợp",        dang: ["tatCa"] }
  ]
};
const TAT_CA = ["lienSau","lienTruoc","lonHon","beHon","dienDau","cong","tru","congThieuSo","truThieuSo","soSanhPhepTinh"];
const TEN_DANG = {
  lienSau: "Số liền sau", lienTruoc: "Số liền trước", lonHon: "Số lớn hơn", beHon: "Số bé hơn",
  dienDau: "Điền dấu > < =", cong: "Phép cộng", tru: "Phép trừ", congThieuSo: "Cộng: tìm số thiếu",
  truThieuSo: "Trừ: tìm số thiếu", soSanhPhepTinh: "So sánh phép tính"
};

// ==GEN-START==
/* =========================================================
   2. BỘ SINH CÂU HỎI (theo giai đoạn s và độ khó lv: 1–4)
   ========================================================= */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const O = '<span class="o">?</span>';
const TRU = "−";
const dau = (x, y) => x > y ? ">" : x < y ? "<" : "=";
function daoChuSo(n){ if (n < 10 || n > 99 || n % 10 === 0) return null; const d = (n % 10) * 10 + Math.floor(n / 10); return d === n ? null : d; }

// Chọn một số theo độ khó: dễ lấy nửa dưới, khó lấy phần trên của phạm vi
function soTheoDoKho(s, lv, a = s.min, b = s.max){
  const span = b - a;
  if (lv === 1) return rnd(a, a + Math.max(Math.min(span, 5), Math.floor(span * 0.5)));
  if (lv === 2) return rnd(a, b);
  return rnd(a + Math.floor(span * 0.4), b);
}
// Số có hàng đơn vị cho trước (dùng cho câu chuyển chục như 29 → 30)
function soDuoi(duoi, a, b){
  const ds = [];
  for (let v = Math.max(a, duoi === 9 ? 9 : 10); v <= b; v++) if (v % 10 === duoi) ds.push(v);
  return ds.length ? pick(ds) : null;
}

// Câu hỏi có đáp án là một số
function cauSo(dang, s, lv, de, bieu, doc, dapAn, uuTien){
  const q = { dang, de, bieu, doc, dapAn: String(dapAn) };
  if (lv === 4){ q.nhapSo = true; q.luaChon = []; return q; }
  let ung;
  if (lv === 1) ung = shuffle([3, -3, 4, -4, 5, -5]).map(d => dapAn + d).concat([dapAn + 2, dapAn - 2, dapAn + 6, dapAn - 6, dapAn + 1, dapAn - 1]);
  else if (lv === 2){ ung = [...uuTien, dapAn + 1, dapAn - 1, dapAn + 2, dapAn - 2]; if (s.max >= 50) ung.push(dapAn + 10, dapAn - 10); ung.push(dapAn + 3, dapAn - 3); }
  else { ung = [...uuTien, daoChuSo(dapAn), dapAn + 1, dapAn - 1]; if (s.max >= 20) ung.push(dapAn + 10, dapAn - 10); ung.push(dapAn + 2, dapAn - 2, dapAn + 3); }
  const can = lv === 1 ? 2 : 3, nhieu = [];
  for (const v of ung){
    if (Number.isInteger(v) && v >= 0 && v <= s.max && v !== dapAn && !nhieu.includes(v)) nhieu.push(v);
    if (nhieu.length === can) break;
  }
  let t = 0;
  while (nhieu.length < can && t++ < 300){ const v = rnd(0, s.max); if (v !== dapAn && !nhieu.includes(v)) nhieu.push(v); }
  q.luaChon = shuffle([dapAn, ...nhieu].map(String));
  return q;
}

// Phép cộng: tổng không vượt phạm vi, giai đoạn 2–4 không nhớ
function taoCong(s, lv){
  for (let t = 0; t < 3000; t++){
    const a = rnd(1, s.max - 1), b = rnd(1, s.max - a), tong = a + b;
    if (s.khongNho && (a % 10) + (b % 10) >= 10) continue;
    if (lv === 1 && tong > Math.max(5, Math.floor(s.max * 0.5))) continue;
    if (lv >= 3 && tong < Math.floor(s.max * (lv === 3 ? 0.5 : 0.7))) continue;
    if (lv === 4 && s.max >= 50 && (a < 10 || b < 10)) continue;
    if (lv >= 2 && s.max >= 50 && a < 10 && b < 10) continue;
    if (lv >= 2 && s.max === 20 && a < 10 && b < 10 && Math.random() < 0.6) continue;
    return [a, b];
  }
  return [2, 3];
}
// Phép trừ: không ra số âm, giai đoạn 2–4 không nhớ
function taoTru(s, lv){
  for (let t = 0; t < 3000; t++){
    const a = rnd(2, s.max), b = rnd(1, a);
    if (b === a && Math.random() < 0.85) continue;
    if (s.khongNho && (a % 10) < (b % 10)) continue;
    if (lv === 1 && a > Math.max(5, Math.floor(s.max * 0.5))) continue;
    if (lv >= 3 && a < Math.floor(s.max * (lv === 3 ? 0.5 : 0.7))) continue;
    if (lv === 4 && s.max >= 50 && b < 10) continue;
    if (lv >= 2 && s.max >= 50 && a < 10) continue;
    if (lv >= 2 && s.max === 20 && a < 10 && Math.random() < 0.6) continue;
    return [a, b];
  }
  return [5, 2];
}
// Hai số khác nhau để so sánh
function haiSoKhac(s, lv){
  for (let t = 0; t < 300; t++){
    let a, b;
    if (lv === 1){
      a = soTheoDoKho(s, 1); b = soTheoDoKho(s, 1);
      if (Math.abs(a - b) < Math.max(2, Math.floor((s.max - s.min) * 0.15))) continue;
    } else if (lv === 2){
      a = rnd(s.min, s.max);
      b = (s.max > 20 && Math.random() < 0.5) ? a + pick([-1, 1]) * rnd(1, 9) : rnd(s.min, s.max);
    } else if (lv === 3){
      a = soTheoDoKho(s, 3); b = a + pick([-1, 1]) * rnd(1, s.max > 20 ? 5 : 2);
    } else {
      a = soTheoDoKho(s, 4); const d = daoChuSo(a);
      b = (d !== null && Math.random() < 0.6) ? d : a + pick([-1, 1]);
    }
    if (b === a || a < s.min || a > s.max || b < s.min || b > s.max) continue;
    return [a, b];
  }
  return [s.min, s.min + 1];
}
function cauLonBe(s, lv, lon){
  const [a, b] = haiSoKhac(s, lv), ds = [a, b];
  if (lv === 4){
    for (let t = 0; t < 30; t++){ const c = a + pick([-2, -1, 1, 2]); if (c >= s.min && c <= s.max && !ds.includes(c)){ ds.push(c); break; } }
  }
  const ba = ds.length > 2;
  const tu = lon ? (ba ? "lớn nhất" : "lớn hơn") : (ba ? "bé nhất" : "bé hơn");
  const sh = shuffle(ds);
  return { dang: lon ? "lonHon" : "beHon", de: `Số nào ${tu}?`, bieu: "", doc: `Số nào ${tu}: ${sh.join(", ")}?`,
           dapAn: String(lon ? Math.max(...ds) : Math.min(...ds)), luaChon: sh.map(String) };
}

const GEN = {
  lienSau(s, lv){
    let n = null;
    if (lv >= 3 && Math.random() < (lv === 3 ? 0.4 : 0.8)) n = soDuoi(9, s.min, s.max - 1);
    if (n === null) n = soTheoDoKho(s, lv, s.min, s.max - 1);
    return cauSo("lienSau", s, lv, `Số liền sau của ${n} là số mấy?`, `${n}, ${O}`, `Số liền sau của ${n} là số mấy?`, n + 1, [n, n - 1]);
  },
  lienTruoc(s, lv){
    let n = null;
    if (lv >= 3 && Math.random() < (lv === 3 ? 0.4 : 0.8)) n = soDuoi(0, s.min + 1, s.max);
    if (n === null) n = soTheoDoKho(s, lv, s.min + 1, s.max);
    return cauSo("lienTruoc", s, lv, `Số liền trước của ${n} là số mấy?`, `${O}, ${n}`, `Số liền trước của ${n} là số mấy?`, n - 1, [n, n + 1]);
  },
  lonHon(s, lv){ return cauLonBe(s, lv, true); },
  beHon(s, lv){ return cauLonBe(s, lv, false); },
  dienDau(s, lv){
    const [x, y] = haiSoKhac(s, lv), a = x, b = Math.random() < [0, 0.15, 0.2, 0.25, 0.3][lv] ? x : y;
    return { dang: "dienDau", de: "Chọn dấu thích hợp", bieu: `${a} ${O} ${b}`, doc: `Chọn dấu lớn hơn, bé hơn hay bằng, giữa ${a} và ${b}`, dapAn: dau(a, b), luaChon: [">", "<", "="] };
  },
  cong(s, lv){ const [a, b] = taoCong(s, lv);
    return cauSo("cong", s, lv, "Tính", `${a} + ${b} = ${O}`, `${a} cộng ${b} bằng mấy?`, a + b, [Math.abs(a - b)]); },
  tru(s, lv){ const [a, b] = taoTru(s, lv);
    return cauSo("tru", s, lv, "Tính", `${a} ${TRU} ${b} = ${O}`, `${a} trừ ${b} bằng mấy?`, a - b, [a + b]); },
  congThieuSo(s, lv){ const [a, b] = taoCong(s, lv), c = a + b;
    return Math.random() < 0.5
      ? cauSo("congThieuSo", s, lv, "Tìm số còn thiếu", `${O} + ${b} = ${c}`, `Số mấy cộng ${b} bằng ${c}?`, a, [b, c])
      : cauSo("congThieuSo", s, lv, "Tìm số còn thiếu", `${a} + ${O} = ${c}`, `${a} cộng mấy bằng ${c}?`, b, [a, c]); },
  truThieuSo(s, lv){ const [a, b] = taoTru(s, lv), c = a - b;
    return Math.random() < 0.5
      ? cauSo("truThieuSo", s, lv, "Tìm số còn thiếu", `${a} ${TRU} ${O} = ${c}`, `${a} trừ mấy bằng ${c}?`, b, [c, a])
      : cauSo("truThieuSo", s, lv, "Tìm số còn thiếu", `${O} ${TRU} ${b} = ${c}`, `Số mấy trừ ${b} bằng ${c}?`, a, [c, b]); },
  soSanhPhepTinh(s, lv){
    const laCong = Math.random() < 0.5, [a, b] = laCong ? taoCong(s, lv) : taoTru(s, lv);
    const r = laCong ? a + b : a - b;
    const lech = lv === 1 ? [-4, -3, 3, 4, 0] : lv === 2 ? [-2, -1, 0, 0, 1, 2] : [-1, 0, 0, 1];
    const n = Math.max(0, Math.min(s.max, r + pick(lech)));
    return { dang: "soSanhPhepTinh", de: "Chọn dấu thích hợp", bieu: `${a} ${laCong ? "+" : TRU} ${b} ${O} ${n}`,
             doc: `So sánh ${a} ${laCong ? "cộng" : "trừ"} ${b} với ${n}`, dapAn: dau(r, n), luaChon: [">", "<", "="] };
  }
};

function taoBo(dsDang, s, lv){
  const bo = [], daCo = new Set();
  for (const dang of dsDang){
    let q;
    for (let t = 0; t < 60; t++){ q = GEN[dang](s, lv); const k = q.de + q.bieu + q.doc; if (!daCo.has(k)){ daCo.add(k); break; } }

}

function dangKiemTra(){

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
let ac = null;
function tiengNot(notes, kieu, am){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach(([f, tre, dai]) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + tre;
      o.type = kieu; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(am, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dai);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dai + 0.03);
    });
  } catch (e) {}
}
function phat(dung){
  if (!DB.caiDat.amThanh) return;
  dung ? tiengNot([[660, 0, 0.2], [880, 0.13, 0.22]], "triangle", 0.25) : tiengNot([[240, 0, 0.2], [180, 0.13, 0.25]], "sine", 0.25);
}

  const offline = !navigator.onLine;

  return ds.slice().sort((a, b) => diem(b) - diem(a))[0];

      <span><span class="ten">Giai đoạn ${k}</span><span class="pham-vi">Các số từ ${s.min} đến ${s.max}</span></span>
      <span class="trang-thai">${tt}</span></button></li>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><button class="btn btn-nho" data-hd="veHome">← Đổi bé</button><button class="btn btn-chu" data-hd="phuHuynh">Dành cho phụ huynh</button></div>
    <h1>Chào ${esc(p.ten)}!</h1>

    <ol class="chang-list">${items}</ol>
    ${p.cauSai.length ? `<div class="kiem-tra on-tap"><div><h2>Ôn lại câu sai</h2>

      <button class="btn btn-chinh" data-hd="onCauSai">Ôn ngay</button></div>` : ""}`;
}

function manBai(k){
  roiQuiz(); manHT = "bai"; K = k;
  const p = hoSo(), d = gd(p, k), s = CONFIG.giaiDoan[k], lv = p.doKho;
  const chonDK = [1,2,3,4].map(l => { const x = CONFIG.doKho[l];
    return `<button class="pill" data-hd="chonDoKho" data-lv="${l}" aria-pressed="${l === lv}" style="--c:${x.mau};--t:${x.chu}">${x.ten}</button>`; }).join("");
  const the = CONFIG.baiHoc.map((b, i) => {
    const n = i + 1, mo = moBai(p, k, n), theoDK = d.diemDoKho[n] || {}, diem = theoDK[lv];
    const cham = [1,2,3,4].map(l => `<i class="${(theoDK[l] || 0) >= CONFIG.diemDatBai ? "co" : ""}" style="--c:${CONFIG.doKho[l].mau}" title="${CONFIG.doKho[l].ten}"></i>`).join("");
    return `<button class="bai" data-hd="lamBai" data-n="${n}" ${mo ? "" : "disabled"}>
      <span class="so">Bài ${n}${mo ? "" : " 🔒"}</span><span class="ten">${b.ten}</span>
      <span class="sao">${diem != null ? saoHTML(diem) : ""}</span>
      <span class="cham-dk" aria-hidden="true">${cham}</span></button>`;
  }).join("");
  const moK = moKT(p, k);
  const tot = d.kiemTra.length ? Math.max(...d.kiemTra.map(x => x.diem)) : null;
  app.innerHTML = `
    <div class="topbar"><button class="btn btn-nho" data-hd="veMap">← Các chặng</button><span class="nho">${esc(p.ten)}</span></div>
    <h1>Giai đoạn ${k}</h1>
    <p class="phu">Các số từ ${s.min} đến ${s.max}. Đúng từ ${CONFIG.diemDatBai}/${CONFIG.soCauBai} câu ở mức nào cũng mở bài tiếp theo.${CONFIG.thoiGianBai ? ` Mỗi câu có ${CONFIG.thoiGianBai} giây.` : ""}</p>
    <div class="do-kho" role="group" aria-label="Chọn độ khó"><span class="nhan">Độ khó:</span>${chonDK}</div>
    <p class="mo-ta-dk">${CONFIG.doKho[lv].moTa} Dấu chấm màu dưới mỗi bài cho biết bé đã đạt ở những mức nào.</p>
    <div class="luoi-bai">${the}</div>
    <div class="kiem-tra">
      <div>
        <h2>Bài kiểm tra lên chặng</h2>
        <p>${CONFIG.soCauKiemTra} câu, mỗi câu ${CONFIG.thoiGianKiemTra} giây, mức ${theDK(p.doKhoKiemTra)}. Đúng từ ${CONFIG.diemDatKiemTra} câu trở lên để ${k < 4 ? `lên giai đoạn ${k + 1}` : "hoàn thành chương trình"}.</p>
        ${tot != null ? `<p class="nho">Lần tốt nhất: ${tot}/${CONFIG.soCauKiemTra}${d.daQua ? ", đã qua ✓" : ""}</p>` : ""}
        ${moK ? "" : `<p class="nho">Học xong bài 10 để mở bài kiểm tra.</p>`}
      </div>
      <button class="btn btn-chinh" data-hd="lamKT" ${moK ? "" : "disabled"}>Làm bài kiểm tra</button>
    </div>`;
}

function batDau(k, n){ // n = số bài, 0 = bài kiểm tra
  const p = hoSo(), s = CONFIG.giaiDoan[k], lv = n ? p.doKho : p.doKhoKiemTra;
  Q = { loai: n ? "bai" : "kiemtra", k, n, lv, cau: taoBo(n ? dangChoBai(n - 1) : dangKiemTra(), s, lv),
        i: 0, dung: 0, daTraLoi: false, sai: [], batDau: Date.now() };
  manQuiz();
}
function batDauOn(dsCau, tuPH){
  if (!dsCau.length){ toast("Không có câu nào để ôn."); return; }
  Q = { loai: "on", k: null, n: 0, lv: null, cau: dsCau, i: 0, dung: 0, daTraLoi: false, sai: [], batDau: Date.now(), tuPhuHuynh: !!tuPH };
  manQuiz();
}
const cauDeOn = (x, k, lv) => Object.assign(chepCau(x), { luaChon: shuffle(x.luaChon || []), _k: k, _lv: lv });
function cauTuNganHang(p){ return shuffle(p.cauSai).slice(0, CONFIG.soCauOn).map(x => cauDeOn(x.q, x.k, x.lv)); }

const banPhimHTML = () => `<div class="ban-phim">
  ${[1,2,3,4,5,6,7,8,9].map(d => `<button data-hd="so" data-d="${d}">${d}</button>`).join("")}

  <button class="xong" data-hd="nopSo" disabled>Xong</button></div>`;

function manQuiz(){
  dungDongHo(); manHT = "quiz";
  const c = Q.cau[Q.i], tong = Q.cau.length, tg = thoiGianCau();
  const tieuDe = Q.loai === "bai" ? `Bài ${Q.n}: ${CONFIG.baiHoc[Q.n - 1].ten}` : Q.loai === "kiemtra" ? "Bài kiểm tra lên chặng" : "Ôn lại câu sai";
  Q.nhap = "";
  app.innerHTML = `
    <div class="topbar"><button class="btn btn-nho" data-hd="thoatQuiz">✕ Dừng</button>
      <span class="nho">${Q.k ? `Giai đoạn ${Q.k}, ` : ""}${tieuDe} ${Q.lv ? theDK(Q.lv) : ""}</span></div>
    <div class="tien-do">
      <span>Câu ${Q.i + 1}/${tong}</span>
      <div class="thanh" role="progressbar" aria-valuemin="0" aria-valuemax="${tong}" aria-valuenow="${Q.i}"><span style="width:${Q.i / tong * 100}%"></span></div>

    <div class="cau">

      <p class="de">${c.de}</p>

    </div>
    ${c.nhapSo ? banPhimHTML() : `<div class="dap-an ${c.luaChon.length === 3 ? "ba" : ""}">
      ${c.luaChon.map((v, j) => `<button class="lua-chon" data-hd="chon" data-j="${j}">${esc(v)}</button>`).join("")}</div>`}
    <div class="goi-y" id="goiY" aria-live="polite"></div>`;
  khoiDongCau();
}

function capNhatNhap(){
  const o = app.querySelector(".cau .o"); if (o) o.textContent = Q.nhap || "?";
  const x = app.querySelector(".ban-phim .xong"); if (x) x.disabled = !Q.nhap;
}
function goSo(d){ if (!Q || Q.daTraLoi || Q.nhap.length >= 3) return; Q.nhap = (Q.nhap === "0" ? "" : Q.nhap) + d; capNhatNhap(); }
function xoaSo(){ if (!Q || Q.daTraLoi) return; Q.nhap = Q.nhap.slice(0, -1); capNhatNhap(); }
function nopSo(){ if (Q && !Q.daTraLoi && Q.nhap) xuLyTraLoi(String(parseInt(Q.nhap, 10))); }

// v = đáp án bé chọn (chuỗi), null = hết giờ
function xuLyTraLoi(v){
  if (!Q || Q.daTraLoi) return;
  Q.daTraLoi = true; dungDongHo();
  const p = hoSo(), c = Q.cau[Q.i], dung = v !== null && v === c.dapAn;
  app.querySelectorAll(".lua-chon, .ban-phim button").forEach(b => b.disabled = true);
  const nut = [...app.querySelectorAll(".lua-chon")];
  if (nut.length){
    nut[c.luaChon.indexOf(c.dapAn)].classList.add("dung");
    if (!dung && v !== null){ const j = c.luaChon.indexOf(v); if (j >= 0) nut[j].classList.add("sai"); }
  }
  const o = app.querySelector(".cau .o");
  if (o){ o.textContent = c.dapAn; o.classList.add("da-dien"); }
  const tk = p.thongKeDang[c.dang] = p.thongKeDang[c.dang] || { dung: 0, tong: 0 };
  tk.tong++; if (dung) tk.dung++;
  const goiY = document.getElementById("goiY");
  if (dung){
    Q.dung++; phat(true);
    if (Q.loai === "on") xoaCauSai(p, c);
    const loi = pick(["Đúng rồi!", "Giỏi quá!", "Chính xác!", "Tuyệt vời!"]);
    goiY.textContent = loi;
    if (DB.caiDat.tuDoc) noi(loi);
    const cu = Q, i = Q.i;
    setTimeout(() => { if (Q === cu && cu.i === i) tiep(); }, 1300);
  } else {
    phat(false);
    Q.sai.push(Object.assign(chepCau(c), { chon: v }));
    if (Q.loai === "on") themCauSai(p, c, c._k, c._lv); else themCauSai(p, c, Q.k, Q.lv);
    const dau = v === null ? "Hết giờ!" : c.nhapSo ? `Bé nhập ${esc(v)}.` : "Chưa đúng.";
    goiY.innerHTML = `${dau} Đáp án là <b>${esc(c.dapAn)}</b>.<br><button class="btn btn-chinh" data-hd="tiep">Câu tiếp theo</button>`;
    if (DB.caiDat.tuDoc) noi(`${v === null ? "Hết giờ. " : ""}Đáp án là ${docDapAn(c.dapAn)}`);
    goiY.querySelector("button").focus();
  }
  luu();
}

function tiep(){
  if (!Q) return;
  Q.i++; Q.daTraLoi = false;
  if (Q.i >= Q.cau.length) ketThuc(); else manQuiz();
}

function ketThuc(){
  dungDongHo(); huyDoc(); manHT = "ketqua";
  const p = hoSo(), tong = Q.cau.length, diem = Q.dung, { k, n, lv, loai } = Q;
  const giay = Math.round((Date.now() - Q.batDau) / 1000);
  p.lichSu.push({ id: "ls" + Date.now(), ngay: new Date().toISOString(), loai, k, n, lv, diem, tong, giay, sai: Q.sai });
  if (p.lichSu.length > 500) p.lichSu.splice(0, p.lichSu.length - 500);
  let tieuDe, loi, nut = "", them = "";
  if (loai === "bai"){
    const d = gd(p, k);
    if (d.diemBai[n] == null || diem > d.diemBai[n]) d.diemBai[n] = diem;
    d.diemDoKho[n] = d.diemDoKho[n] || {};
    if (d.diemDoKho[n][lv] == null || diem > d.diemDoKho[n][lv]) d.diemDoKho[n][lv] = diem;
    if (diem >= CONFIG.diemDatBai){
      tieuDe = `Hoàn thành bài ${n}!`;
      them = `<div class="sao-to" aria-hidden="true">${"★".repeat(saoCua(diem))}</div>`;
      loi = n < 10 ? `Bài ${n + 1} đã mở.` : "Bài kiểm tra lên chặng đã mở.";
      nut = n < 10 ? `<button class="btn btn-chinh" data-hd="lamBai" data-n="${n + 1}">Học bài ${n + 1}</button>`
                   : `<button class="btn btn-chinh" data-hd="lamKT">Làm bài kiểm tra</button>`;
      if (lv < 4) nut += `<button class="btn" data-hd="thuKhoHon" data-n="${n}" data-lv="${lv + 1}">Thử mức ${CONFIG.doKho[lv + 1].ten}</button>`;
      nut += `<button class="btn" data-hd="lamBai" data-n="${n}">Làm lại</button>`;
    } else {
      tieuDe = "Gần được rồi!";
      loi = `Bé cần đúng ${CONFIG.diemDatBai} câu. Làm lại nhé.${lv > 1 ? ` Bé cũng có thể thử mức ${CONFIG.doKho[lv - 1].ten}.` : ""}`;
      nut = `<button class="btn btn-chinh" data-hd="lamBai" data-n="${n}">Làm lại</button>`;
      if (lv > 1) nut += `<button class="btn" data-hd="thuKhoHon" data-n="${n}" data-lv="${lv - 1}">Làm ở mức ${CONFIG.doKho[lv - 1].ten}</button>`;
    }
  } else if (loai === "kiemtra"){
    const d = gd(p, k);
    d.kiemTra.push({ ngay: new Date().toISOString(), diem, lv });
    if (diem >= CONFIG.diemDatKiemTra){
      d.daQua = true;
      tieuDe = k < 4 ? `Bé đã lên giai đoạn ${k + 1}!` : "Bé đã hoàn thành cả 4 giai đoạn!";
      loi = k < 4 ? `Giai đoạn ${k + 1} học các số từ ${CONFIG.giaiDoan[k + 1].min} đến ${CONFIG.giaiDoan[k + 1].max}.` : "Chúc mừng bé, giỏi quá!";
      them = `<div class="sao-to" aria-hidden="true">🏆</div>`;
      nut = k < 4 ? `<button class="btn btn-chinh" data-hd="moGD" data-k="${k + 1}">Sang giai đoạn ${k + 1}</button>` : `<button class="btn btn-chinh" data-hd="veMap">Về các chặng</button>`;
    } else {
      tieuDe = "Cố lên nào!";
      loi = `Cần đúng ${CONFIG.diemDatKiemTra} câu để lên chặng. Ôn lại các bài rồi thử lần nữa nhé.`;
      nut = `<button class="btn btn-chinh" data-hd="lamKT">Làm lại bài kiểm tra</button>`;
    }
  } else {
    const con = p.cauSai.length;
    tieuDe = diem === tong ? "Sửa hết lỗi rồi!" : "Ôn tập xong!";
    loi = con ? `Còn ${con} câu cần ôn lại.` : "Không còn câu sai nào cần ôn.";
    if (con) nut = `<button class="btn btn-chinh" data-hd="${Q.tuPhuHuynh ? "onCauSaiPH" : "onCauSai"}">Ôn tiếp</button>`;
  }
  luu();
  const sai = Q.sai, tuPH = Q.tuPhuHuynh;
  Q = null;
  const nutVe = loai === "on"
    ? (tuPH ? `<button class="btn" data-hd="vePH">Về trang phụ huynh</button>` : `<button class="btn" data-hd="veMap">Về các chặng</button>`)
    : `<button class="btn" data-hd="moGD" data-k="${k}">Danh sách bài</button>`;
  app.innerHTML = `
    <div class="topbar"><span></span><span class="nho">${esc(p.ten)}${k ? `, giai đoạn ${k}` : ""} ${lv ? theDK(lv) : ""}</span></div>
    <section class="ket-qua">
      <h1>${tieuDe}</h1>
      <div class="diem-khung" aria-label="Đúng ${diem} trên ${tong} câu"><span class="diem">${diem}</span><span class="tren">/${tong}</span></div>
      ${them}
      <p>${loi}</p>
      <p class="nho">Thời gian làm bài: ${dinhDangGio(giay)}</p>
      <div class="nut-hang">${nut}${nutVe}</div>
      ${sai.length ? `<details><summary>Xem các câu làm sai (${sai.length})</summary><ul>
        ${sai.map(x => `<li>${moTaCau(x)}. ${x.chon === null ? "Hết giờ" : `Bé chọn <b>${esc(x.chon)}</b>`}, đáp án đúng là <b>${esc(x.dapAn)}</b>.</li>`).join("")}
      </ul></details>` : ""}
    </section>`;
}

/* =========================================================
   6. KHU VỰC PHỤ HUYNH
   ========================================================= */
let PH = { tab: "thanhTich", locGD: "0", locLoai: "tatca", soDong: 30 };

function vaoPhuHuynh(){
  const a = rnd(6, 9), b = rnd(6, 9);
  const t = prompt(`Phần dành cho phụ huynh.\nNhập kết quả: ${a} × ${b} = ?`);
  if (t === null) return;
  if (parseInt(t, 10) === a * b){ PH.soDong = 30; manPhuHuynh(); } else toast("Chưa đúng, thử lại nhé.");
}

function tinhThanhTich(p){
  const ls = p.lichSu;
  let tongCau = 0, tongDung = 0, tongGiay = 0;
  ls.forEach(x => { tongCau += x.tong; tongDung += x.diem; tongGiay += x.giay || 0; });
  const ngaySet = new Set(ls.map(x => khoaNgay(x.ngay)));
  let chuoi = 0; const d = new Date();
  if (!ngaySet.has(khoaNgay(d))) d.setDate(d.getDate() - 1);
  while (ngaySet.has(khoaNgay(d))){ chuoi++; d.setDate(d.getDate() - 1); }
  let chuoiDai = 0, hienTai = 0, truoc = null;
  [...ngaySet].sort().forEach(k => {
    const t = new Date(k + "T00:00:00");
    hienTai = (truoc && Math.round((t - truoc) / 86400000) === 1) ? hienTai + 1 : 1;
    chuoiDai = Math.max(chuoiDai, hienTai); truoc = t;
  });
  let sao = 0, gdQua = 0;
  for (let k = 1; k <= 4; k++){
    const g = gd(p, k); if (g.daQua) gdQua++;
    for (let n = 1; n <= 10; n++) if (g.diemBai[n] != null) sao += saoCua(g.diemBai[n]);
  }
  return {
    lanLam: ls.length, tongCau, tongDung, tongGiay, sao, gdQua, chuoi, chuoiDai, soNgay: ngaySet.size,
    tyLe: tongCau ? Math.round(tongDung / tongCau * 100) : 0,
    diem10: ls.filter(x => x.loai === "bai" && x.diem === x.tong).length,
    quaRatKho: ls.some(x => x.loai === "bai" && x.lv === 4 && x.diem >= CONFIG.diemDatBai),
    onHet: ls.some(x => x.loai === "on" && x.tong > 0 && x.diem === x.tong)
  };
}
const HUY_HIEU = [
  ["🌱", "Bước đầu tiên", "Làm xong lượt đầu tiên", t => t.lanLam >= 1],
  ["💯", "Điểm 10 đầu tiên", "Đúng hết một bài", t => t.diem10 >= 1],
  ["🏅", "Mười lần điểm 10", "10 bài đúng hết", t => t.diem10 >= 10],
  ["🥉", "Qua giai đoạn 1", "Đạt bài kiểm tra giai đoạn 1", t => t.gdQua >= 1],
  ["🥈", "Qua giai đoạn 2", "Đạt bài kiểm tra giai đoạn 2", t => t.gdQua >= 2],
  ["🥇", "Qua giai đoạn 3", "Đạt bài kiểm tra giai đoạn 3", t => t.gdQua >= 3],
  ["🏆", "Hoàn thành chương trình", "Qua cả 4 giai đoạn", t => t.gdQua >= 4],
  ["🔥", "Chinh phục Rất khó", "Đạt một bài ở mức Rất khó", t => t.quaRatKho],
  ["🛠️", "Sửa sai giỏi", "Ôn câu sai đúng hết một lượt", t => t.onHet],
  ["📅", "Chăm chỉ 3 ngày", "Học 3 ngày liên tiếp", t => t.chuoiDai >= 3],
  ["🗓️", "Chăm chỉ 7 ngày", "Học 7 ngày liên tiếp", t => t.chuoiDai >= 7],
  ["⭐", "500 câu đúng", "Trả lời đúng 500 câu", t => t.tongDung >= 500]
];

function tabThanhTich(p){
  const t = tinhThanhTich(p);
  const oSo = [[t.lanLam, "lượt làm bài"], [t.tongCau, "câu đã trả lời"], [t.tyLe + "%", "trả lời đúng"], [dinhDangGio(t.tongGiay), "thời gian học"],
               [t.sao + " ★", "sao đã đạt (tối đa 120)"], [t.gdQua + "/4", "giai đoạn đã qua"], [t.soNgay, "ngày đã học"], [t.chuoi + " ngày", "chuỗi học liên tiếp"]]
    .map(([a, b]) => `<div><b>${a}</b><span>${b}</span></div>`).join("");
  const bang = [1,2,3,4].map(k => {
    const g = gd(p, k);
    const baiQua = Object.values(g.diemBai).filter(x => x >= CONFIG.diemDatBai).length;
    const ratKho = Object.values(g.diemDoKho).filter(x => (x[4] || 0) >= CONFIG.diemDatBai).length;
    const tot = g.kiemTra.length ? Math.max(...g.kiemTra.map(x => x.diem)) : "–";
    const tt = g.daQua ? "Đã qua" : moGD(p, k) ? "Đang học" : "Chưa mở";
    return `<tr><td>Giai đoạn ${k}</td><td>${baiQua}/10</td><td>${ratKho}/10</td><td>${g.kiemTra.length}</td><td>${tot}</td><td>${tt}</td></tr>`;
  }).join("");
  const cot = Object.keys(TEN_DANG).map(dg => {
    const x = p.thongKeDang[dg];
    if (!x || !x.tong) return `<div class="cot"><span>${TEN_DANG[dg]}</span><div class="nen"></div><span class="so nho">Chưa làm</span></div>`;
    const pt = Math.round(x.dung / x.tong * 100), mau = pt >= 80 ? "var(--leaf)" : pt >= 60 ? "var(--sun)" : "var(--red)";
    return `<div class="cot"><span>${TEN_DANG[dg]}${x.tong >= 10 && pt < 70 ? ` <span class="yeu">cần luyện thêm</span>` : ""}</span>
      <div class="nen"><span style="width:${pt}%;background:${mau}"></span></div><span class="so">${pt}% <span class="nho">(${x.dung}/${x.tong})</span></span></div>`;
  }).join("");
  const theoNgay = {};
  p.lichSu.forEach(x => { const k = khoaNgay(x.ngay); theoNgay[k] = (theoNgay[k] || 0) + x.tong; });
  const ngay = [];
  for (let i = 13; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate() - i); const k = khoaNgay(d); ngay.push({ v: theoNgay[k] || 0, nhan: `${d.getDate()}/${d.getMonth() + 1}` }); }
  const lon = Math.max(1, ...ngay.map(x => x.v));
  const huy = HUY_HIEU.map(([bh, ten, mt, dk]) => `<div class="${dk(t) ? "" : "chua"}"><span class="bh">${bh}</span>${ten}<small>${mt}</small></div>`).join("");
  return `
    <section class="khoi"><h2>Tổng quan</h2><div class="o-so">${oSo}</div></section>
    <section class="khoi"><h2>Theo giai đoạn</h2>
      <div class="cuon"><table><tr><th>Chặng</th><th>Bài đã qua</th><th>Đạt mức Rất khó</th><th>Lần kiểm tra</th><th>Điểm KT cao nhất</th><th>Trạng thái</th></tr>${bang}</table></div>
      ${p.moKhoaTatCa ? `<p class="nho" style="margin-top:8px">Đang bật mở khóa tất cả trong phần Cài đặt.</p>` : ""}</section>
    <section class="khoi"><h2>Tỷ lệ đúng theo dạng bài</h2>
      <p class="nho">Dạng nào dưới 70% sau ít nhất 10 câu sẽ được đánh dấu cần luyện thêm.</p>${cot}</section>
    <section class="khoi"><h2>Số câu làm mỗi ngày</h2><p class="nho">14 ngày gần đây</p>
      <div class="bieu-do">${ngay.map(x => `<div class="c" title="${x.nhan}: ${x.v} câu"><em>${x.v || ""}</em><span style="height:${x.v / lon * 85}%"></span></div>`).join("")}</div>
      <div class="nhan-ngay">${ngay.map(x => `<span>${x.nhan}</span>`).join("")}</div></section>
    <section class="khoi"><h2>Huy hiệu</h2><div class="huy-hieu">${huy}</div></section>`;
}

function nhanLuot(x){
  if (x.loai === "bai") return `Giai đoạn ${x.k}, bài ${x.n}: ${CONFIG.baiHoc[x.n - 1].ten}`;
  if (x.loai === "kiemtra") return `Giai đoạn ${x.k}, kiểm tra lên chặng`;
  return "Ôn câu sai";
}
function datLuot(x){ return x.loai === "bai" ? x.diem >= CONFIG.diemDatBai : x.loai === "kiemtra" ? x.diem >= CONFIG.diemDatKiemTra : x.diem === x.tong; }

function tabLichSu(p){
  let ls = p.lichSu.slice().reverse();
  if (PH.locGD !== "0") ls = ls.filter(x => String(x.k) === PH.locGD);
  if (PH.locLoai !== "tatca") ls = ls.filter(x => x.loai === PH.locLoai);
  const hien = ls.slice(0, PH.soDong);
  const dong = hien.map(x => `
    <details class="dong-ls"><summary>
      <b>${ngayGio(x.ngay)}</b><span>${nhanLuot(x)}</span>${x.lv ? theDK(x.lv) : ""}
      <span class="${datLuot(x) ? "dat" : "chua-dat"}">${x.diem}/${x.tong}</span><span class="nho">${dinhDangGio(x.giay)}</span>
    </summary><div class="ct">
      ${x.sai.length ? `<p>Câu trả lời sai (${x.sai.length}):</p><ul>${x.sai.map(c => `<li>${moTaCau(c)}. ${c.chon === null ? "Hết giờ" : `Bé chọn <b>${esc(c.chon)}</b>`}, đáp án <b>${esc(c.dapAn)}</b>.</li>`).join("")}</ul>
        <button class="btn btn-nho" data-hd="onTuLuot" data-id="${x.id}">Cho bé làm lại các câu sai này</button>` : `<p>Không có câu sai.</p>`}
      <button class="btn btn-chu" data-hd="xoaLuot" data-id="${x.id}">Xóa lượt này</button>
    </div></details>`).join("");
  return `
    <section class="khoi"><h2>Lịch sử làm bài</h2>
      <div class="loc">
        <label>Giai đoạn <select id="locGD"><option value="0">Tất cả</option>${[1,2,3,4].map(k => `<option value="${k}" ${PH.locGD === String(k) ? "selected" : ""}>Giai đoạn ${k}</option>`).join("")}</select></label>
        <label>Loại <select id="locLoai">${[["tatca","Tất cả"],["bai","Bài tập"],["kiemtra","Kiểm tra lên chặng"],["on","Ôn câu sai"]].map(([v, t]) => `<option value="${v}" ${PH.locLoai === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      </div>
      <p class="nho">Hiển thị ${hien.length}/${ls.length} lượt. Bấm vào một lượt để xem các câu bé trả lời sai.</p>
      ${dong || "<p>Chưa có lượt làm bài nào.</p>"}
      ${ls.length > PH.soDong ? `<button class="btn btn-nho" data-hd="xemThem">Xem thêm</button>` : ""}
      ${p.lichSu.length ? `<p style="margin-top:14px"><button class="btn btn-nho btn-nguy" data-hd="xoaLichSu">Xóa toàn bộ lịch sử</button></p>
        <p class="nho">Xóa lịch sử không làm mất tiến độ mở khóa bài học.</p>` : ""}
    </section>`;
}

      <div class="dong-cai"><label for="caiTocDo">Tốc độ đọc</label><select id="caiTocDo">

function manPhuHuynh(){
  roiQuiz(); manHT = "phuhuynh";
  const p = hoSo(), ds = Object.values(DB.hoSo);
  const tabs = [["thanhTich", "Thành tích"], ["lichSu", "Lịch sử làm bài"], ["cauSai", "Câu trả lời sai"], ["caiDat", "Cài đặt"]];
  const noiDung = (!p && PH.tab !== "caiDat")
    ? `<section class="khoi"><p>Chưa chọn bé nào. Hãy thêm hoặc chọn bé ở trang chính.</p></section>`
    : { thanhTich: tabThanhTich, lichSu: tabLichSu, cauSai: tabCauSai, caiDat: tabCaiDat }[PH.tab](p);
  app.innerHTML = `
    <div class="topbar"><button class="btn btn-nho" data-hd="${p ? "veMap" : "veHome"}">← Quay lại</button>
      ${ds.length > 1 ? `<label class="nho">Xem bé <select id="phHoSo">${ds.map(x => `<option value="${x.id}" ${p && x.id === p.id ? "selected" : ""}>${esc(x.ten)}</option>`).join("")}</select></label>`
                      : `<span class="nho">${p ? esc(p.ten) : ""}</span>`}</div>
    <h1>Dành cho phụ huynh</h1>
    ${luuDuoc ? "" : `<p class="phu" style="color:var(--red)">Trình duyệt đang chặn lưu dữ liệu. Hãy mở file bằng Chrome hoặc Edge.</p>`}
    <div class="tabs" role="tablist">${tabs.map(([id, ten]) => `<button class="tab" role="tab" aria-selected="${PH.tab === id}" data-hd="tabPH" data-tab="${id}">${ten}${id === "cauSai" && p && p.cauSai.length ? ` (${p.cauSai.length})` : ""}</button>`).join("")}</div>
    ${noiDung}`;
}

function xuat(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `hoc-toan-sao-luu-${khoaNgay(new Date())}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Đã xuất file sao lưu.");
}
document.getElementById("fileNhap").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d.hoSo !== "object") throw new Error();
      if (!confirm("Thay toàn bộ dữ liệu hiện tại bằng dữ liệu trong file này?")) return;
      DB = napDuLieu(d); luu(); toast("Đã nhập dữ liệu."); manHome();
    } catch (err) { toast("File không đúng định dạng sao lưu."); }
  };
  r.readAsText(f);
  e.target.value = "";
});

function themHoSo(){
  const o = document.getElementById("tenMoi"), ten = o.value.trim();
  if (!ten){ toast("Nhập tên của bé trước nhé."); o.focus(); return; }
  const id = "hs" + Date.now();
  DB.hoSo[id] = chuanHoa({ id, ten, taoLuc: new Date().toISOString() });
  DB.dangChon = id; luu(); manMap();
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-hd]");
  if (!b || b.disabled) return;
  const hd = b.dataset.hd, p = hoSo();
  switch (hd){
    case "chonHoSo": DB.dangChon = b.dataset.id; luu(); manMap(); break;
    case "themHoSo": themHoSo(); break;
    case "veHome":   manHome(); break;
    case "veMap":    manMap(); break;
    case "vePH":     manPhuHuynh(); break;
    case "moGD":     manBai(Number(b.dataset.k)); break;
    case "chonDoKho": p.doKho = Number(b.dataset.lv); luu(); manBai(K); break;
    case "lamBai":   batDau(K, Number(b.dataset.n)); break;
    case "thuKhoHon": p.doKho = Number(b.dataset.lv); luu(); batDau(K, Number(b.dataset.n)); break;
    case "lamKT":    batDau(K, 0); break;
    case "onCauSai":   batDauOn(cauTuNganHang(p), false); break;
    case "onCauSaiPH": batDauOn(cauTuNganHang(p), true); break;
    case "chon":     if (Q) xuLyTraLoi(Q.cau[Q.i].luaChon[Number(b.dataset.j)]); break;
    case "so":       goSo(b.dataset.d); break;
    case "xoaSo":    xoaSo(); break;
    case "nopSo":    nopSo(); break;
    case "tiep":     tiep(); break;
    case "docCau":   if (Q && !noi(Q.cau[Q.i].doc)) toast("Máy chưa có giọng đọc tiếng Việt."); break;
    case "thoatQuiz":
      if (confirm("Dừng bài này? Kết quả bài đang làm sẽ không được lưu.")){
        const q = Q; roiQuiz();
        if (q.loai === "on") q.tuPhuHuynh ? manPhuHuynh() : manMap(); else manBai(q.k);
      }
      break;
    case "phuHuynh": vaoPhuHuynh(); break;
    case "tabPH":    PH.tab = b.dataset.tab; manPhuHuynh(); break;
    case "xemThem":  PH.soDong += 30; manPhuHuynh(); break;
    case "onTuLuot": {
      const x = p.lichSu.find(l => l.id === b.dataset.id);
      if (x) batDauOn(x.sai.map(c => cauDeOn(c, x.k, x.lv)), true);
      break;
    }
    case "xoaLuot":
      if (confirm("Xóa lượt làm bài này khỏi lịch sử?")){ p.lichSu = p.lichSu.filter(l => l.id !== b.dataset.id); luu(); manPhuHuynh(); }
      break;
    case "xoaLichSu":
      if (confirm(`Xóa toàn bộ lịch sử làm bài của ${p.ten}? Tiến độ mở khóa bài học vẫn được giữ.`)){ p.lichSu = []; p.thongKeDang = {}; luu(); manPhuHuynh(); }
      break;
    case "xoaCau":   p.cauSai.splice(Number(b.dataset.i), 1); luu(); manPhuHuynh(); break;
    case "xoaHetCauSai":
      if (confirm("Xóa tất cả câu sai đang lưu?")){ p.cauSai = []; luu(); manPhuHuynh(); }
      break;
    case "docThu":   if (!noi("Xin chào. 3 cộng 4 bằng mấy?")) toast("Máy chưa có giọng đọc tiếng Việt."); break;
    case "themPhatAm": {
      const tu = document.getElementById("pamTu").value.trim(), doc = document.getElementById("pamDoc").value.trim();
      if (!tu || !doc){ toast("Nhập cả chữ hiển thị và cách đọc."); break; }
      DB.caiDat.phatAm = (DB.caiDat.phatAm || []).filter(r => r.tu.toLowerCase() !== tu.toLowerCase());
      DB.caiDat.phatAm.push({ tu, doc }); luu(); manPhuHuynh(); noi(tu); break;
    }
    case "xoaPhatAm": DB.caiDat.phatAm.splice(Number(b.dataset.i), 1); luu(); manPhuHuynh(); break;
    case "thuPhatAm": if (!noi(DB.caiDat.phatAm[Number(b.dataset.i)].tu)) toast("Máy chưa có giọng đọc tiếng Việt."); break;
    case "docCauThu": if (!noi(document.getElementById("pamThu").value)) toast("Máy chưa có giọng đọc tiếng Việt."); break;
    case "xuat":     xuat(); break;
    case "nhap":     document.getElementById("fileNhap").click(); break;
    case "xoaHoSo":
      if (p && confirm(`Xóa toàn bộ tiến độ của ${p.ten}? Không thể hoàn tác.`)){ delete DB.hoSo[p.id]; DB.dangChon = null; luu(); toast("Đã xóa hồ sơ."); manHome(); }
      break;
  }
});

app.addEventListener("change", e => {
  const id = e.target.id, p = hoSo();

  if (id === "caiMoKhoa" && p){ p.moKhoaTatCa = e.target.checked; luu(); toast(p.moKhoaTatCa ? "Đã mở khóa tất cả." : "Đã khóa lại theo tiến độ."); }
  if (id === "caiDoKhoKT" && p){ p.doKhoKiemTra = Number(e.target.value); luu(); }
  if (id === "phHoSo"){ DB.dangChon = e.target.value; luu(); PH.soDong = 30; manPhuHuynh(); }
  if (id === "locGD"){ PH.locGD = e.target.value; PH.soDong = 30; manPhuHuynh(); }
  if (id === "locLoai"){ PH.locLoai = e.target.value; PH.soDong = 30; manPhuHuynh(); }
});

document.addEventListener("keydown", e => {
  if (e.target.id === "tenMoi" && e.key === "Enter"){ themHoSo(); return; }
  if (!Q || Q.daTraLoi || ["INPUT", "SELECT"].includes(e.target.tagName)) return;
  const c = Q.cau[Q.i];
  if (c.nhapSo){
    if (/^[0-9]$/.test(e.key)) goSo(e.key);
    else if (e.key === "Backspace") xoaSo();
    else if (e.key === "Enter"){ e.preventDefault(); nopSo(); }
  } else if ([">", "<", "="].includes(e.key) && c.luaChon.includes(e.key)) xuLyTraLoi(e.key);
});

if ("speechSynthesis" in window){
  speechSynthesis.getVoices();
  speechSynthesis.addEventListener("voiceschanged", () => { if (manHT === "phuhuynh" && PH.tab === "caiDat") manPhuHuynh(); });
}

/* Khởi động */
hienCanhBao();
if (hoSo()) manMap(); else manHome();
</script>
