<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bé học toán lớp 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFDFF; --grid:#E4EDF9; --grid-strong:#C6D8F0;
    --ink:#1E3A8A; --ink-soft:#5468A3; --red:#D6342C; --sun:#FFC83D;
    --leaf:#2F9E5B; --sky:#3B82C4; --white:#FFFFFF;
    --font:"Baloo 2","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font); color:var(--ink); font-size:clamp(17px,2.4vw,20px); line-height:1.4; min-height:100vh; min-height:100dvh;
    -webkit-tap-highlight-color:transparent;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px);
    background-size:40px 40px, 40px 40px, 40px 10px;
  }
  #app{
    max-width:920px; margin:0 auto;
    padding:calc(62px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  }
  button,input,select{font-family:inherit; color:inherit}
  button{cursor:pointer; touch-action:manipulation}
  button:disabled{cursor:not-allowed}
  button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:4px solid var(--sun); outline-offset:3px}

  h1{font-size:clamp(30px,5.5vw,44px); line-height:1.1; margin:8px 0 4px; font-weight:800}
  h2{font-size:clamp(22px,3.6vw,28px); line-height:1.2; margin:0 0 12px; font-weight:800}
  h3{font-size:21px; margin:18px 0 8px}
  .phu{color:var(--ink-soft); margin:0 0 20px}
  .nho{font-size:16px; color:var(--ink-soft)}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; min-height:44px; flex-wrap:wrap}
  .btn{border:3px solid var(--ink); background:var(--white); border-radius:14px; padding:8px 18px; font-size:19px; font-weight:700; box-shadow:0 4px 0 var(--ink); transition:transform .08s, box-shadow .08s}
  .btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
  .btn:disabled{opacity:.45; box-shadow:none}
  .btn-chinh{background:var(--sun)}
  .btn-nho{font-size:16px; padding:5px 12px; box-shadow:0 3px 0 var(--ink); border-radius:12px}
  .btn-chu{border:none; background:none; box-shadow:none; padding:6px 4px; text-decoration:underline; font-weight:600; font-size:16px; color:var(--ink-soft)}
  .btn-nguy{border-color:var(--red); color:var(--red); box-shadow:0 3px 0 var(--red)}
  select{font-size:18px; padding:4px 10px; border:3px solid var(--ink); border-radius:12px; background:var(--white); color:var(--ink); max-width:100%}

  /* Thanh công cụ cố định: toàn màn hình + khóa */
  .cong-cu{position:fixed; z-index:30; top:calc(10px + env(safe-area-inset-top,0px)); right:calc(10px + env(safe-area-inset-right,0px)); display:flex; gap:8px}
  .cong-cu button{width:46px; height:46px; border-radius:50%; border:3px solid var(--ink); background:var(--white); box-shadow:0 3px 0 var(--ink); font-size:20px; display:grid; place-items:center; padding:0}
  .cong-cu button svg{width:22px; height:22px}
  body.da-khoa .cong-cu #nutKhoa{background:var(--sun)}
  body.da-khoa .an-khi-khoa{display:none !important}
  body.da-khoa{-webkit-user-select:none; user-select:none}

  /* Trang chào */
  .hero{margin:4px 0 28px}
  .hero-so{font-size:clamp(48px,10vw,72px); font-weight:800; line-height:1; letter-spacing:4px}
  .ds-ho-so{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:24px}
  .the-ten{display:flex; flex-direction:column; align-items:flex-start; min-width:150px; padding:12px 20px; background:var(--white); border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink); text-align:left}
  .the-ten .ten{font-size:28px; font-weight:800; line-height:1.1}
  .them label{display:block; font-weight:700; margin-bottom:6px}
  .hang{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .hang input{flex:1; min-width:170px; font-size:20px; padding:8px 14px; border:3px solid var(--ink); border-radius:14px; background:var(--white)}

  /* Bản đồ chặng */
  .chang-list{list-style:none; padding:0; margin:0; position:relative}
  .chang-list::before{content:""; position:absolute; left:50px; top:30px; bottom:30px; border-left:5px dashed var(--grid-strong)}
  .chang{position:relative; display:flex; align-items:center; gap:18px; width:100%; background:var(--white); border:3px solid var(--ink); border-radius:22px; padding:14px 18px; margin-bottom:20px; text-align:left; box-shadow:0 5px 0 var(--ink)}
  .chang .tron{flex:none; width:60px; height:60px; border-radius:50%; display:grid; place-items:center; font-size:32px; font-weight:800; border:3px solid var(--ink); background:var(--c)}
  .chang .ten{display:block; font-size:clamp(20px,3.6vw,25px); font-weight:800; line-height:1.15}
  .chang .pham-vi{display:block; font-size:17px; color:var(--ink-soft)}
  .chang .trang-thai{margin-left:auto; font-size:16px; font-weight:700; text-align:right; display:flex; align-items:center; gap:6px}
  .chang .trang-thai svg{width:34px; height:40px}
  .chang.qua .trang-thai{color:var(--leaf)}
  .chang:disabled{opacity:.55; box-shadow:none}

  /* Độ khó */
  .do-kho{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 6px}
  .do-kho .nhan{font-weight:700; margin-right:4px}
  .pill{border:3px solid var(--c); background:var(--white); color:var(--ink); border-radius:999px; padding:3px 16px; font-size:18px; font-weight:700}
  .pill[aria-pressed="true"]{background:var(--c); color:var(--t)}
  .mo-ta-dk{font-size:16px; color:var(--ink-soft); margin:0 0 16px}
  .the-dk{display:inline-block; font-size:14px; font-weight:700; padding:0 10px; border-radius:999px; background:var(--c); color:var(--t); line-height:1.6; vertical-align:middle}
  .cham-dk{display:flex; gap:5px; margin-top:4px}
  .cham-dk i{display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid var(--grid-strong)}
  .cham-dk i.co{background:var(--c); border-color:var(--c)}

  /* Tổng sao */
  .tong-sao{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; background:var(--white); border:3px solid var(--ink); border-radius:16px; padding:10px 16px; margin-bottom:16px}
  .tong-sao b{font-size:24px; color:#C98D00}
  .tong-sao .thanh{flex:1; min-width:160px; position:relative}
  .tong-sao .vach-dat{position:absolute; top:-4px; bottom:-4px; width:3px; background:var(--red)}

  /* Danh sách bài */
  .luoi-bai{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
  .bai{display:flex; flex-direction:column; gap:2px; min-height:124px; padding:12px 14px; background:var(--white); border:3px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 var(--ink); text-align:left}
  .bai .so{font-size:15px; font-weight:700; color:var(--ink-soft)}
  .bai .ten{font-size:18px; font-weight:800; line-height:1.2}
  .bai .sao{margin-top:auto; font-size:20px; color:#C98D00; font-weight:800; min-height:26px}
  .bai .sao small{font-size:15px; color:var(--ink-soft)}
  .bai:disabled{opacity:.5; box-shadow:none}
  .kiem-tra{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; margin-top:24px; padding:18px 20px; background:#FFF7DD; border:3px solid var(--ink); border-radius:20px}
  .kiem-tra > div{flex:1; min-width:240px}
  .kiem-tra p{margin:0 0 4px}
  .on-tap{background:#EAF4FF}

  /* Làm bài */
  .quiz{-webkit-user-select:none; user-select:none}
  .tien-do{display:flex; align-items:center; gap:12px; margin-bottom:12px; font-weight:700; font-size:18px}
  .thanh{flex:1; height:16px; border:3px solid var(--ink); border-radius:10px; background:var(--white); overflow:hidden}
  .thanh > span{display:block; height:100%; background:var(--leaf); transition:width .3s}
  .dung-dem{color:var(--leaf)}
  .dong-ho{display:flex; align-items:center; gap:10px; margin:0 0 14px; font-weight:700}
  .dong-ho .khung{flex:1; height:22px; border:3px solid var(--ink); border-radius:12px; background:var(--white); overflow:hidden}
  .dong-ho .vach{display:block; height:100%; width:100%; background:var(--sun)}
  .dong-ho .so-giay{min-width:64px; text-align:right; font-size:26px; font-weight:800}
  .dong-ho.cho{opacity:.55}
  .dong-ho.gap .vach{background:var(--red)}
  .dong-ho.gap .so-giay{color:var(--red)}
  .cau{position:relative; background:var(--white); border:3px solid var(--ink); border-radius:26px; padding:46px 16px 28px; text-align:center; margin-bottom:20px}
  .cau .de{font-size:clamp(20px,3.6vw,28px); font-weight:700; margin:0}
  .cau .bieu-thuc{font-size:clamp(38px,10vw,76px); font-weight:800; line-height:1.1; margin:12px 0 0; letter-spacing:2px; white-space:nowrap}
  .o{display:inline-block; min-width:1.15em; padding:0 .12em; border:4px dashed var(--red); border-radius:14px; color:var(--red); line-height:1.05}
  .o.da-dien{border-style:solid; border-color:var(--leaf); color:var(--leaf)}
  .o-nho{display:inline-block; min-width:1.4em; text-align:center; border:2px dashed var(--red); border-radius:6px; color:var(--red); line-height:1.2}
  .nut-doc{position:absolute; top:10px; right:10px}
  .dap-an{display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(10px,2vw,16px)}
  .dap-an.ba{grid-template-columns:repeat(3,1fr)}
  .lua-chon{font-size:clamp(30px,7vw,54px); font-weight:800; padding:clamp(8px,1.8vw,14px) 8px; background:var(--white); border:4px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink); transition:transform .08s, box-shadow .08s}
  .lua-chon:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
  .lua-chon:disabled{cursor:default}
  .lua-chon.dung{background:var(--leaf); border-color:var(--leaf); color:var(--white); box-shadow:0 6px 0 #1F6E3F}
  .lua-chon.sai{background:var(--red); border-color:var(--red); color:var(--white); box-shadow:0 6px 0 #8E1F19}
  .ban-phim{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:420px; margin:0 auto}
  .ban-phim button{font-size:clamp(26px,6vw,36px); font-weight:800; padding:4px; background:var(--white); border:3px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 var(--ink)}
  .ban-phim button:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
  .ban-phim .xong{background:var(--sun); font-size:24px}
  .ban-phim button:disabled{opacity:.5; box-shadow:none}
  .mic{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; margin-top:16px}
  .mic .btn.dang-nghe{background:#FFE1DF; border-color:var(--red); color:var(--red); box-shadow:0 3px 0 var(--red); animation:nhip 1.1s ease-in-out infinite}
  @keyframes nhip{50%{transform:scale(1.06)}}
  .goi-y{text-align:center; margin-top:16px; font-size:clamp(20px,3.4vw,24px); font-weight:700; min-height:40px}
  .goi-y .btn{margin-top:10px}

  /* Kết quả */
  .ket-qua{text-align:center; background:var(--white); border:3px solid var(--ink); border-radius:26px; padding:28px 20px}
  .diem-khung{display:inline-flex; align-items:baseline; gap:4px; margin:6px 0 10px; padding:6px 30px; border:5px solid var(--red); border-radius:50%; color:var(--red); transform:rotate(-6deg); animation:dong-dau .45s cubic-bezier(.2,1.6,.4,1) both}
  .diem{font-size:clamp(64px,14vw,92px); font-weight:800; line-height:1}
  .tren{font-size:36px; font-weight:700}
  @keyframes dong-dau{from{transform:rotate(-20deg) scale(2); opacity:0} to{transform:rotate(-6deg) scale(1); opacity:1}}
  .sao-to{font-size:44px; color:#C98D00; line-height:1; font-weight:800}
  .ket-qua .cup{width:120px; height:140px}
  .nut-hang{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:20px}
  .ket-qua details{margin-top:22px; text-align:left; font-size:18px}
  summary{cursor:pointer; font-weight:700}
  .ket-qua details ul{padding-left:22px}

  /* Chúc mừng: cúp, hoa, pháo hoa */
  .cm{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px; background:rgba(20,36,92,.62)}
  .cm canvas{position:absolute; inset:0; pointer-events:none; z-index:2}
  .cm-the{position:relative; z-index:1; width:100%; max-width:460px; background:var(--white); border:4px solid var(--ink); border-radius:28px; padding:22px 24px 26px; text-align:center; box-shadow:0 8px 0 var(--ink); animation:cm-vao .45s ease-out both}
  .cm-the h2{font-size:clamp(24px,5vw,34px); margin:6px 0}
  .cm-the p{margin:0 0 16px}
  .cm-hinh{position:relative; display:inline-block}
  .cm-hinh::before{content:""; position:absolute; inset:-18px; border-radius:50%; background:radial-gradient(circle, rgba(255,200,61,.55), transparent 65%); animation:toa 2.4s linear infinite}
  .cm .cup{position:relative; width:150px; height:175px; animation:cup-len .8s cubic-bezier(.2,1.5,.4,1) both}
  .cm .bh-to{position:relative; display:block; font-size:96px; line-height:1.1; animation:cup-len .8s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes cm-vao{from{transform:translateY(30px); opacity:0}}
  @keyframes cup-len{from{transform:scale(.2) rotate(-25deg); opacity:0}}
  @keyframes toa{50%{transform:scale(1.15); opacity:.7}}

  /* Phụ huynh */
  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 18px}
  .tab{border:3px solid var(--ink); background:var(--white); border-radius:999px; padding:4px 16px; font-size:18px; font-weight:700}
  .tab[aria-selected="true"]{background:var(--ink); color:var(--white)}
  .khoi{background:var(--white); border:3px solid var(--ink); border-radius:18px; padding:16px 18px; margin-bottom:18px}
  .khoi p{margin:0 0 10px}
  .cuon{overflow-x:auto}
  table{border-collapse:collapse; width:100%; font-size:17px}
  th,td{border:2px solid var(--grid-strong); padding:6px 10px; text-align:left; vertical-align:top}
  th{background:#EEF4FC}
  .chon-o{display:flex; align-items:center; gap:10px; margin:8px 0; font-size:19px}
  .chon-o input{width:22px; height:22px; flex:none}
  .dong-cai{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:10px 0}
  .dong-cai > label{font-weight:700; min-width:150px}
  .o-so{display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:12px}
  .o-so div{border:3px solid var(--ink); border-radius:16px; padding:10px 14px; background:#F7FAFF}
  .o-so b{display:block; font-size:28px; line-height:1.15}
  .o-so span{font-size:15px; color:var(--ink-soft)}
  .cot{display:grid; grid-template-columns:minmax(110px,170px) 1fr 110px; align-items:center; gap:10px; font-size:17px; margin:7px 0}
  .cot .nen{height:16px; border:2px solid var(--ink); border-radius:8px; overflow:hidden; background:#F3F7FD}
  .cot .nen span{display:block; height:100%}
  .cot .so{text-align:right; font-weight:700}
  .yeu{color:var(--red); font-weight:700; font-size:15px}
  .bieu-do{display:flex; align-items:flex-end; gap:6px; height:150px; border-bottom:3px solid var(--ink)}
  .bieu-do .c{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%}
  .bieu-do .c em{font-style:normal; font-size:13px; font-weight:700}
  .bieu-do .c span{width:100%; max-width:34px; background:var(--sky); border-radius:6px 6px 0 0}
  .nhan-ngay{display:flex; gap:6px; margin-top:4px}
  .nhan-ngay span{flex:1; text-align:center; font-size:11px; color:var(--ink-soft)}
  .huy-hieu{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
  .huy-hieu div{border:3px solid var(--ink); border-radius:16px; padding:10px; text-align:center; background:#FFFBEA; font-size:16px; font-weight:700; line-height:1.25}
  .huy-hieu .bh{font-size:36px; display:block; line-height:1.2}
  .huy-hieu small{display:block; font-weight:500; color:var(--ink-soft); font-size:14px; margin-top:4px}
  .huy-hieu .chua{opacity:.4; filter:grayscale(1); border-style:dashed; background:var(--white)}
  .loc{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:12px}
  .dong-ls{border:2px solid var(--grid-strong); border-radius:12px; padding:8px 12px; margin-bottom:8px; background:var(--white)}
  .dong-ls summary{display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; font-weight:500; font-size:17px}
  .dong-ls .ct{padding:8px 4px 2px; font-size:17px}
  .dong-ls ul{margin:4px 0 10px; padding-left:22px}
  .dat{color:var(--leaf); font-weight:800}
  .chua-dat{color:var(--red); font-weight:800}
  #thuMicKQ{font-weight:700}

  .canh-bao{background:var(--red); color:var(--white); padding:10px 16px; text-align:center; font-size:17px; font-weight:700}
  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--white); padding:10px 20px; border-radius:14px; font-size:18px; font-weight:700; z-index:60; max-width:90vw; text-align:center}

  /* Máy tính, màn hình rộng */
  @media (min-width:1024px){
    .luoi-bai{grid-template-columns:repeat(5,1fr)}
    .quiz{max-width:760px; margin:0 auto}
  }
  /* Điện thoại dọc */
  @media (max-width:540px){
    .chang{gap:12px; padding:12px}
    .chang .tron{width:50px; height:50px; font-size:26px}
    .chang-list::before{left:40px}
    .chang .trang-thai{font-size:14px}
    .cot{grid-template-columns:105px 1fr 82px; font-size:15px}
    .luoi-bai{grid-template-columns:repeat(2,1fr); gap:10px}
    .bai{min-height:112px; padding:10px}
  }
  /* Điện thoại xoay ngang, máy có chiều cao thấp */
  @media (orientation:landscape) and (max-height:620px){
    #app{padding-top:calc(10px + env(safe-area-inset-top,0px)); padding-bottom:16px}
    .topbar{padding-right:112px; margin-bottom:8px}
    .quiz-khung{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:16px; align-items:center}
    .cau{margin-bottom:0; padding:48px 12px 16px}
    .cau .bieu-thuc{font-size:clamp(32px,10vh,60px)}
    .lua-chon{font-size:clamp(24px,8vh,44px); padding:6px}
    .ban-phim{gap:6px}
    .ban-phim button{font-size:24px; padding:0}
    .tien-do,.dong-ho{margin-bottom:6px}
    .goi-y{margin-top:8px}
    .cm .cup{width:100px; height:118px}
    .cm .bh-to{font-size:64px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important}
  }
</style>
</head>
<body>
<div class="cong-cu">
  <button id="nutToanMH" aria-label="Toàn màn hình" title="Toàn màn hình">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="nutKhoa" aria-label="Khóa giao diện" title="Khóa giao diện">🔓</button>
</div>
<div id="canhBao" class="canh-bao" hidden></div>
<main id="app"></main>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="fileNhap" accept=".json,application/json" hidden>

<script>
/* =========================================================
   1. CẤU HÌNH — muốn đổi luật chỉ cần sửa ở đây
   ========================================================= */
const CONFIG = {
  soCauBai: 10,          // số câu mỗi bài (mỗi câu đúng = 1 sao)

function vanCau(q){

  if (/^\d+$/.test(q.dapAn)) so.add(Number(q.dapAn));

// muc càng cao thì nới lỏng càng nhiều luật (khi phạm vi số quá nhỏ không đủ câu khác nhau)
function giongNhau(v, truoc, ganDay, muc){
  if (truoc.some(x => x.khoa === v.khoa)) return true;                         // trùng bộ số trong cùng bài
  const p1 = truoc[truoc.length - 1], p2 = truoc[truoc.length - 2];
  if (muc < 3) for (const x of truoc.slice(-2)) if (v.so.filter(n => x.so.includes(n)).length >= 2) return true; // chung 2 số với 2 câu trước
  if (muc < 4 && p1){
    const laDau = /[<>=]/.test(v.dapAn);
    if (!laDau && p1.dapAn === v.dapAn) return true;                           // cùng đáp án với câu ngay trước
    if (laDau && p2 && p1.dapAn === v.dapAn && p2.dapAn === v.dapAn) return true; // 3 câu cùng một dấu liền nhau
  }
  if (muc < 2){
    if (p1 && p1.dang === v.dang && Math.abs(p1.lon - v.lon) <= 1) return true; // cùng dạng, số quá sát câu trước
    if (ganDay.includes(v.khoa)) return true;                                   // vừa gặp ở những lần học gần đây
  }

}

    if (a[i] !== a[i - 1]) continue;

function chuanHoa(p){
  p.gd = p.gd || {}; p.lichSu = p.lichSu || []; p.cauSai = p.cauSai || []; p.thongKeDang = p.thongKeDang || {};
  p.ganDay = p.ganDay || [];

  if (!p.doKhoKiemTra) p.doKhoKiemTra = 2;
  if (p.moKhoaTatCa === undefined) p.moKhoaTatCa = false;
  if (p.huyHieu === undefined) p.huyHieu = null;   // null = hồ sơ cũ, sẽ ghi nhận huy hiệu đã có mà không chúc mừng lại
  return p;
}
function napDuLieu(d){
  const db = Object.assign(dbMoi(), d);
  db.caiDat = Object.assign(caiDatMoi(), d.caiDat || {});
  if ((d.phienBan || 1) < 2) db.caiDat.tuDoc = true;
  db.phienBan = 3;
  Object.values(db.hoSo || {}).forEach(chuanHoa);
  return db;
}

function gd(p, k){
  if (!p.gd[k]) p.gd[k] = { diemBai: {}, diemDoKho: {}, kiemTra: [], daQua: false };
  const d = p.gd[k];
  if (!d.diemDoKho){ d.diemDoKho = {}; for (const n in d.diemBai) d.diemDoKho[n] = { 2: d.diemBai[n] }; }
  return d;
}
function tongSao(p, k){ const d = gd(p, k); let s = 0; for (let n = 1; n <= 10; n++) s += d.diemBai[n] || 0; return s; }
const moGD  = (p, k) => p.moKhoaTatCa || k === 1 || gd(p, k - 1).daQua;
const moBai = (p, k, n) => p.moKhoaTatCa || n === 1 || (gd(p, k).diemBai[n - 1] || 0) >= CONFIG.diemDatBai;
const moKT  = (p, k) => p.moKhoaTatCa || ((gd(p, k).diemBai[10] || 0) >= CONFIG.diemDatBai && tongSao(p, k) >= CONFIG.saoMoKiemTra);
function gdHienTai(p){ let k = 1; while (k < 4 && gd(p, k).daQua) k++; return k; }

function themCauSai(p, c, k, lv){

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
let ac = null;
function tiengNot(notes, kieu, am){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach(([f, tre, dai]) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + tre;
      o.type = kieu; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(am, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dai);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dai + 0.03);
    });
  } catch (e) {}
}
function phat(dung){
  if (!DB.caiDat.amThanh) return;
  dung ? tiengNot([[660, 0, 0.2], [880, 0.13, 0.22]], "triangle", 0.25) : tiengNot([[240, 0, 0.2], [180, 0.13, 0.25]], "sine", 0.25);
}
function phatTic(){ if (DB.caiDat.amThanh) tiengNot([[1050, 0, 0.06]], "square", 0.06); }
function phatKenChienThang(){

}

function dsGiongViet(){
  if (!("speechSynthesis" in window)) return [];
  return speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("vi"));
}
function giongViet(){
  const ds = dsGiongViet(); if (!ds.length) return null;
  const daChon = ds.find(v => v.name === DB.caiDat.giong); if (daChon) return daChon;
  const offline = !navigator.onLine;
  const diem = v => (/natural|online|google/i.test(v.name) ? (offline ? -5 : 3) : 0) + (v.localService ? (offline ? 5 : 1) : 0);
  return ds.slice().sort((a, b) => diem(b) - diem(a))[0];
}
function chuanBiDoc(text){
  let t = String(text).normalize("NFC");
  for (const r of (DB.caiDat.phatAm || [])){
    if (!r.tu) continue;
    const re = new RegExp(r.tu.normalize("NFC").replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    t = t.replace(re, r.doc.normalize("NFC"));
  }
  return t;
}
function noi(text, xong){
  const g = giongViet(); if (!g) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(chuanBiDoc(text));
  u.voice = g; u.lang = g.lang; u.rate = DB.caiDat.tocDo || 0.9;
  if (xong){ u.onend = xong; u.onerror = xong; }
  speechSynthesis.speak(u);
  return true;
}
function huyDoc(){ if ("speechSynthesis" in window) speechSynthesis.cancel(); }

const LopNghe = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let boNghe = null, loiNgheNang = false;
function thongBaoLoiNghe(err){
  if (err === "not-allowed" || err === "service-not-allowed") return "Trình duyệt chưa cho phép dùng micro. Bấm biểu tượng micro hoặc ổ khóa trên thanh địa chỉ để cho phép.";
  if (err === "network") return "Nhận diện giọng nói cần kết nối Internet.";
  if (err === "no-speech") return "Không nghe thấy gì. Thử nói to và rõ hơn.";
  if (err === "audio-capture") return "Không tìm thấy micro trên máy.";
  return "Lỗi nhận diện giọng nói: " + err;
}
function dungNghe(){
  if (boNghe){ const r = boNghe; boNghe = null; r.onend = null; r.onresult = null; r.onerror = null; try { r.abort(); } catch (e) {} }
  const nut = document.getElementById("nutMic");
  if (nut){ nut.classList.remove("dang-nghe"); nut.textContent = "🎤 Bấm để nói"; }
}
function batNghe(){
  if (!Q || Q.daTraLoi || !DB.caiDat.traLoiGiong || !LopNghe) return;
  dungNghe();
  const cu = Q, i = Q.i, r = new LopNghe();
  r.lang = "vi-VN"; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
  const tt = document.getElementById("micTT"), nut = document.getElementById("nutMic");
  r.onresult = e => {
    if (Q !== cu || cu.i !== i || cu.daTraLoi) return;
    const ds = [...e.results[0]].map(a => a.transcript);
    const v = hieuCauTraLoi(ds, cu.cau[i]);
    if (v !== null){ dungNghe(); xuLyTraLoi(v); }
    else if (tt) tt.textContent = `Bé nói "${ds[0]}". Nói lại nhé.`;
  };
  r.onerror = e => {
    if (["not-allowed", "service-not-allowed", "network", "audio-capture"].includes(e.error)){ loiNgheNang = true; toast(thongBaoLoiNghe(e.error)); }
  };
  r.onend = () => {
    if (boNghe !== r) return;
    boNghe = null;
    if (nut){ nut.classList.remove("dang-nghe"); nut.textContent = "🎤 Bấm để nói"; }
    if (Q === cu && cu.i === i && !cu.daTraLoi && DB.caiDat.ngheTuDong && !loiNgheNang) setTimeout(() => { if (Q === cu && cu.i === i && !cu.daTraLoi && !boNghe) batNghe(); }, 250);
  };
  try { r.start(); boNghe = r; } catch (e) { return; }
  if (nut){ nut.classList.add("dang-nghe"); nut.textContent = "🎤 Đang nghe…"; }
}
function thuMic(){
  const kq = document.getElementById("thuMicKQ");
  if (!LopNghe){ kq.textContent = "Trình duyệt này không hỗ trợ nhận diện giọng nói. Hãy dùng Chrome hoặc Edge."; return; }
  const r = new LopNghe(); r.lang = "vi-VN"; r.maxAlternatives = 5;
  kq.textContent = "Đang nghe… hãy nói một số, ví dụ \"mười lăm\".";
  r.onresult = e => {
    const a = e.results[0][0].transcript, n = timSo(a), d = timDau(a);
    kq.textContent = `Máy nghe được: "${a}"` + (n !== null ? `, hiểu là số ${n}.` : d ? `, hiểu là dấu ${d}.` : ", chưa hiểu được.");
  };
  r.onerror = e => { kq.textContent = thongBaoLoiNghe(e.error); };
  r.onend = () => { if (kq.textContent.startsWith("Đang nghe")) kq.textContent = "Không nghe thấy gì. Thử lại nhé."; };
  try { r.start(); } catch (e) {}
}

function khoaNgay(x){ const d = new Date(x); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function dinhDangGio(s){

function phaoHoa(cv){
  const ctx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  let w, h;
  const doiCo = () => { w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  doiCo(); addEventListener("resize", doiCo);
  const giam = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MAU = ["#FFC83D", "#D6342C", "#2F9E5B", "#3B82C4", "#F472B6", "#A855F7", "#FF8A00", "#FFFFFF"];
  const HOA = ["🌸", "🌼", "🌺", "🌷", "💮", "🌻"];
  const hat = [], hoa = [];
  for (let i = 0; i < (giam ? 14 : 46); i++)
    hoa.push({ x: rand() * w, y: giam ? rand() * h : -rand() * h, v: 1.2 + rand() * 2.2, r: rand() * 6.28, vr: (rand() - .5) * .06, s: 22 + rand() * 20, e: pick(HOA), dx: (rand() - .5) * .8 });
  let t = 0, id, chay = true;
  function no(){
    const x = w * (.12 + rand() * .76), y = h * (.1 + rand() * .4), c = pick(MAU), c2 = pick(MAU), n = 70;
    for (let i = 0; i < n; i++){ const a = i / n * 6.283, sp = 1.8 + rand() * 3.8; hat.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, l: 1, c: i % 3 ? c : c2 }); }
  }
  function ve(){
    if (!chay) return;
    ctx.clearRect(0, 0, w, h);
    if (!giam && t % 26 === 0 && t < 520) no();
    t++;
    ctx.globalCompositeOperation = "lighter";
    for (let i = hat.length - 1; i >= 0; i--){
      const p = hat[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.985; p.vy *= 0.985; p.l -= 0.011;
      if (p.l <= 0){ hat.splice(i, 1); continue; }
      ctx.globalAlpha = p.l; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 2.8, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const f of hoa){
      if (!giam){
        f.y += f.v; f.x += f.dx + Math.sin((t + f.s * 10) * 0.03) * 0.7; f.r += f.vr;
        if (f.y > h + 30 && t < 700){ f.y = -30; f.x = rand() * w; }
      }
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.r); ctx.font = f.s + "px serif"; ctx.fillText(f.e, 0, 0); ctx.restore();
    }
    id = requestAnimationFrame(ve);
  }
  ve();
  return () => { chay = false; cancelAnimationFrame(id); removeEventListener("resize", doiCo); };
}

/* =========================================================
   6. HUY HIỆU VÀ THÀNH TÍCH
   ========================================================= */
function tinhThanhTich(p){
  const ls = p.lichSu;
  let tongCau = 0, tongDung = 0, tongGiay = 0;
  ls.forEach(x => { tongCau += x.tong; tongDung += x.diem; tongGiay += x.giay || 0; });
  const ngaySet = new Set(ls.map(x => khoaNgay(x.ngay)));
  let chuoi = 0; const d = new Date();
  if (!ngaySet.has(khoaNgay(d))) d.setDate(d.getDate() - 1);
  while (ngaySet.has(khoaNgay(d))){ chuoi++; d.setDate(d.getDate() - 1); }
  let chuoiDai = 0, hienTai = 0, truoc = null;
  [...ngaySet].sort().forEach(k => {
    const t = new Date(k + "T00:00:00");
    hienTai = (truoc && Math.round((t - truoc) / 86400000) === 1) ? hienTai + 1 : 1;
    chuoiDai = Math.max(chuoiDai, hienTai); truoc = t;
  });
  let sao = 0, gdQua = 0; const cup = { vang: 0, bac: 0, dong: 0 };
  for (let k = 1; k <= 4; k++){ const g = gd(p, k); if (g.daQua) gdQua++; if (g.cup) cup[g.cup]++; sao += tongSao(p, k); }
  return {
    lanLam: ls.length, tongCau, tongDung, tongGiay, sao, gdQua, chuoi, chuoiDai, soNgay: ngaySet.size, cup,
    tyLe: tongCau ? Math.round(tongDung / tongCau * 100) : 0,
    diem10: ls.filter(x => x.loai === "bai" && x.diem === x.tong).length,
    quaRatKho: ls.some(x => x.loai === "bai" && x.lv === 4 && x.diem >= CONFIG.diemDatBai),
    onHet: ls.some(x => x.loai === "on" && x.tong > 0 && x.diem === x.tong)
  };
}
const HUY_HIEU = [

function kiemTraHuyHieu(p){
  const t = tinhThanhTich(p);
  const moi = HUY_HIEU.filter(h => h[3](t) && !p.huyHieu.includes(h[1]));
  moi.forEach(h => p.huyHieu.push(h[1]));
  return moi;
}

  if (p.ganDay.length > CONFIG.nhoCauGanDay) p.ganDay.splice(0, p.ganDay.length - CONFIG.nhoCauGanDay);

function capNhatNhap(){
  const o = app.querySelector(".cau .o"); if (o) o.textContent = Q.nhap || "?";
  const x = app.querySelector(".ban-phim .xong"); if (x) x.disabled = !Q.nhap;
}
function goSo(d){ if (!Q || Q.daTraLoi || Q.nhap.length >= 3) return; Q.nhap = (Q.nhap === "0" ? "" : Q.nhap) + d; capNhatNhap(); }
function xoaSo(){ if (!Q || Q.daTraLoi) return; Q.nhap = Q.nhap.slice(0, -1); capNhatNhap(); }
function nopSo(){ if (Q && !Q.daTraLoi && Q.nhap) xuLyTraLoi(String(parseInt(Q.nhap, 10))); }

function xuLyTraLoi(v){
  if (!Q || Q.daTraLoi) return;
  Q.daTraLoi = true; dungDongHo(); dungNghe();
  const p = hoSo(), c = Q.cau[Q.i], dung = v !== null && v === c.dapAn;
  app.querySelectorAll(".lua-chon, .ban-phim button, #nutMic").forEach(b => b.disabled = true);
  const nut = [...app.querySelectorAll(".lua-chon")];
  if (nut.length){
    nut[c.luaChon.indexOf(c.dapAn)].classList.add("dung");
    if (!dung && v !== null){ const j = c.luaChon.indexOf(v); if (j >= 0) nut[j].classList.add("sai"); }
  }
  const o = app.querySelector(".cau .o");
  if (o){ o.textContent = c.dapAn; o.classList.add("da-dien"); }
  const tk = p.thongKeDang[c.dang] = p.thongKeDang[c.dang] || { dung: 0, tong: 0 };
  tk.tong++; if (dung) tk.dung++;
  const goiY = document.getElementById("goiY");
  if (dung){
    Q.dung++; phat(true);
    if (Q.loai === "on") xoaCauSai(p, c);
    const loi = pick(["Đúng rồi!", "Giỏi quá!", "Chính xác!", "Tuyệt vời!", "Bé giỏi lắm!"]);
    goiY.textContent = loi;
    if (DB.caiDat.tuDoc) noi(loi);
    const cu = Q, i = Q.i;
    setTimeout(() => { if (Q === cu && cu.i === i) tiep(); }, 1300);
  } else {
    phat(false);
    Q.sai.push(Object.assign(chepCau(c), { chon: v }));
    if (Q.loai === "on") themCauSai(p, c, c._k, c._lv); else themCauSai(p, c, Q.k, Q.lv);
    const dau = v === null ? "Hết giờ!" : c.nhapSo ? `Bé trả lời ${esc(v)}.` : "Chưa đúng.";
    goiY.innerHTML = `${dau} Đáp án là <b>${esc(c.dapAn)}</b>.<br><button class="btn btn-chinh" data-hd="tiep">Câu tiếp theo</button>`;
    if (DB.caiDat.tuDoc) noi(`${v === null ? "Hết giờ. " : ""}Đáp án là ${docDapAn(c.dapAn)}`);
    goiY.querySelector("button").focus();
  }
  luu();
}

function tiep(){
  if (!Q) return;
  Q.i++; Q.daTraLoi = false;
  if (Q.i >= Q.cau.length) ketThuc(); else manQuiz();
}

function ketThuc(){
  dungDongHo(); huyDoc(); dungNghe(); manHT = "ketqua";
  const p = hoSo(), tong = Q.cau.length, diem = Q.dung, { k, n, lv, loai } = Q;
  const giay = Math.round((Date.now() - Q.batDau) / 1000);
  const ls = { id: "ls" + Date.now(), ngay: new Date().toISOString(), loai, k, n, lv, diem, tong, giay, sai: Q.sai };
  p.lichSu.push(ls);
  if (p.lichSu.length > 500) p.lichSu.splice(0, p.lichSu.length - 500);
  let tieuDe, loi, nut = "", them = "", camOn = null;
  if (loai === "bai"){
    const d = gd(p, k);
    if (d.diemBai[n] == null || diem > d.diemBai[n]) d.diemBai[n] = diem;
    d.diemDoKho[n] = d.diemDoKho[n] || {};
    if (d.diemDoKho[n][lv] == null || diem > d.diemDoKho[n][lv]) d.diemDoKho[n][lv] = diem;
    const sao = tongSao(p, k);
    them = `<div class="sao-to">★ ${diem}</div>`;
    if (diem >= CONFIG.diemDatBai){
      tieuDe = `Hoàn thành bài ${n}!`;
      loi = (n < 10 ? `Bài ${n + 1} đã mở. ` : "") + `Tổng sao giai đoạn ${k}: ${sao}/100.` +
            (n === 10 || (d.diemBai[10] || 0) >= CONFIG.diemDatBai ? (sao >= CONFIG.saoMoKiemTra ? " Bé đã đủ sao để làm bài kiểm tra!" : ` Cần trên ${CONFIG.saoMoKiemTra - 1} sao để làm bài kiểm tra.`) : "");
      nut = n < 10 ? `<button class="btn btn-chinh" data-hd="lamBai" data-n="${n + 1}">Học bài ${n + 1}</button>`
                   : (moKT(p, k) ? `<button class="btn btn-chinh" data-hd="lamKT">Làm bài kiểm tra</button>` : "");
      if (lv < 4) nut += `<button class="btn" data-hd="thuKhoHon" data-n="${n}" data-lv="${lv + 1}">Thử mức ${CONFIG.doKho[lv + 1].ten}</button>`;
      nut += `<button class="btn" data-hd="lamBai" data-n="${n}">Làm lại</button>`;
    } else {
      tieuDe = "Gần được rồi!";
      loi = `Bé cần đúng ${CONFIG.diemDatBai} câu. Làm lại nhé.${lv > 1 ? ` Bé cũng có thể thử mức ${CONFIG.doKho[lv - 1].ten}.` : ""}`;
      nut = `<button class="btn btn-chinh" data-hd="lamBai" data-n="${n}">Làm lại</button>`;
      if (lv > 1) nut += `<button class="btn" data-hd="thuKhoHon" data-n="${n}" data-lv="${lv - 1}">Làm ở mức ${CONFIG.doKho[lv - 1].ten}</button>`;
    }
  } else if (loai === "kiemtra"){
    const d = gd(p, k), cup = loaiCup(diem);
    d.kiemTra.push({ ngay: ls.ngay, diem, lv, cup });
    ls.cup = cup;
    if (diem >= CONFIG.diemDatKiemTra){
      const c = cup || "dong";
      d.daQua = true;
      if (!d.cup || HANG_CUP[c] > HANG_CUP[d.cup]) d.cup = c;
      tieuDe = k < 4 ? `Bé đã lên giai đoạn ${k + 1}!` : "Bé đã hoàn thành cả 4 giai đoạn!";
      loi = `Bé đạt ${CUP[c].ten}. ` + (k < 4 ? `Giai đoạn ${k + 1} học các số từ ${CONFIG.giaiDoan[k + 1].min} đến ${CONFIG.giaiDoan[k + 1].max}.` : "Chúc mừng bé, giỏi quá!");
      them = cupSVG(c);
      nut = k < 4 ? `<button class="btn btn-chinh" data-hd="moGD" data-k="${k + 1}">Sang giai đoạn ${k + 1}</button>` : `<button class="btn btn-chinh" data-hd="veMap">Về các chặng</button>`;
      camOn = { hinh: cupSVG(c, diem), tieuDe: `${CUP[c].ten}!`,
                phu: `Bé đúng ${diem}/${tong} câu${k < 4 ? ` và đã lên giai đoạn ${k + 1}` : " và hoàn thành cả 4 giai đoạn"}.`,
                doc: `Chúc mừng bé đạt ${CUP[c].ten}` };
    } else {
      tieuDe = "Cố lên nào!";
      loi = `Cần đúng từ ${CONFIG.diemDatKiemTra} câu để lên chặng. Ôn lại các bài rồi thử lần nữa nhé.`;
      nut = `<button class="btn btn-chinh" data-hd="lamKT">Làm lại bài kiểm tra</button>`;
    }
  } else {
    const con = p.cauSai.length;
    tieuDe = diem === tong ? "Sửa hết lỗi rồi!" : "Ôn tập xong!";
    loi = con ? `Còn ${con} câu cần ôn lại.` : "Không còn câu sai nào cần ôn.";
    if (con) nut = `<button class="btn btn-chinh" data-hd="${Q.tuPhuHuynh ? "onCauSaiPH" : "onCauSai"}">Ôn tiếp</button>`;
  }
  const huyMoi = kiemTraHuyHieu(p);
  luu();

      </ul></details>` : ""}
    </section>`;
  if (camOn) chucMung(camOn);
  huyMoi.forEach(([bh, ten, mt]) => chucMung({ hinh: `<span class="bh-to">${bh}</span>`, tieuDe: `Chúc mừng bé đạt huy hiệu "${ten}"!`, phu: mt, doc: `Chúc mừng bé đạt huy hiệu ${ten}` }));

function tabThanhTich(p){
  const t = tinhThanhTich(p);
  const oSo = [[t.lanLam, "lượt làm bài"], [t.tongCau, "câu đã trả lời"], [t.tyLe + "%", "trả lời đúng"], [dinhDangGio(t.tongGiay), "thời gian học"],
               [t.sao + " ★", "tổng sao (tối đa 400)"], [t.gdQua + "/4", "giai đoạn đã qua"], [`${t.cup.vang} · ${t.cup.bac} · ${t.cup.dong}`, "cúp vàng · bạc · đồng"],
               [t.soNgay, "ngày đã học"], [t.chuoi + " ngày", "chuỗi học liên tiếp"]]
    .map(([a, b]) => `<div><b>${a}</b><span>${b}</span></div>`).join("");
  const bang = [1,2,3,4].map(k => {
    const g = gd(p, k);
    const baiQua = Object.values(g.diemBai).filter(x => x >= CONFIG.diemDatBai).length;
    const ratKho = Object.values(g.diemDoKho).filter(x => (x[4] || 0) >= CONFIG.diemDatBai).length;
    const tot = g.kiemTra.length ? Math.max(...g.kiemTra.map(x => x.diem)) : "–";
    const tt = g.daQua ? "Đã qua" : moGD(p, k) ? "Đang học" : "Chưa mở";
    return `<tr><td>Giai đoạn ${k}</td><td>${baiQua}/10</td><td>${tongSao(p, k)}/100</td><td>${ratKho}/10</td><td>${g.kiemTra.length}</td><td>${tot}</td><td>${g.cup ? CUP[g.cup].ten : "–"}</td><td>${tt}</td></tr>`;
  }).join("");
  const cot = Object.keys(TEN_DANG).map(dg => {
    const x = p.thongKeDang[dg];
    if (!x || !x.tong) return `<div class="cot"><span>${TEN_DANG[dg]}</span><div class="nen"></div><span class="so nho">Chưa làm</span></div>`;
    const pt = Math.round(x.dung / x.tong * 100), mau = pt >= 80 ? "var(--leaf)" : pt >= 60 ? "var(--sun)" : "var(--red)";
    return `<div class="cot"><span>${TEN_DANG[dg]}${x.tong >= 10 && pt < 70 ? ` <span class="yeu">cần luyện thêm</span>` : ""}</span>
      <div class="nen"><span style="width:${pt}%;background:${mau}"></span></div><span class="so">${pt}% <span class="nho">(${x.dung}/${x.tong})</span></span></div>`;
  }).join("");
  const theoNgay = {};
  p.lichSu.forEach(x => { const k = khoaNgay(x.ngay); theoNgay[k] = (theoNgay[k] || 0) + x.tong; });
  const ngay = [];
  for (let i = 13; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate() - i); const k = khoaNgay(d); ngay.push({ v: theoNgay[k] || 0, nhan: `${d.getDate()}/${d.getMonth() + 1}` }); }
  const lon = Math.max(1, ...ngay.map(x => x.v));
  const huy = HUY_HIEU.map(([bh, ten, mt, dk]) => `<div class="${dk(t) ? "" : "chua"}"><span class="bh">${bh}</span>${ten}<small>${mt}</small></div>`).join("");
  return `
    <section class="khoi"><h2>Tổng quan</h2><div class="o-so">${oSo}</div></section>
    <section class="khoi"><h2>Theo giai đoạn</h2>
      <div class="cuon"><table><tr><th>Chặng</th><th>Bài đã qua</th><th>Sao</th><th>Đạt Rất khó</th><th>Lần KT</th><th>Điểm KT cao nhất</th><th>Cúp</th><th>Trạng thái</th></tr>${bang}</table></div>
      ${p.moKhoaTatCa ? `<p class="nho" style="margin-top:8px">Đang bật mở khóa tất cả trong phần Cài đặt.</p>` : ""}</section>
    <section class="khoi"><h2>Tỷ lệ đúng theo dạng bài</h2>
      <p class="nho">Dạng nào dưới 70% sau ít nhất 10 câu sẽ được đánh dấu cần luyện thêm.</p>${cot}</section>
    <section class="khoi"><h2>Số câu làm mỗi ngày</h2><p class="nho">14 ngày gần đây</p>
      <div class="bieu-do">${ngay.map(x => `<div class="c" title="${x.nhan}: ${x.v} câu"><em>${x.v || ""}</em><span style="height:${x.v / lon * 85}%"></span></div>`).join("")}</div>
      <div class="nhan-ngay">${ngay.map(x => `<span>${x.nhan}</span>`).join("")}</div></section>
    <section class="khoi"><h2>Huy hiệu</h2><div class="huy-hieu">${huy}</div></section>`;
}

function nhanLuot(x){
  if (x.loai === "bai") return `Giai đoạn ${x.k}, bài ${x.n}: ${CONFIG.baiHoc[x.n - 1].ten}`;
  if (x.loai === "kiemtra") return `Giai đoạn ${x.k}, kiểm tra lên chặng${x.cup ? ` (${CUP[x.cup].ten})` : ""}`;
  return "Ôn câu sai";
}
function datLuot(x){ return x.loai === "bai" ? x.diem >= CONFIG.diemDatBai : x.loai === "kiemtra" ? x.diem >= CONFIG.diemDatKiemTra : x.diem === x.tong; }

      ${x.sai.length ? `<p>Câu trả lời sai (${x.sai.length}):</p><ul>${x.sai.map(c => `<li>${moTaCau(c)}. ${c.chon === null ? "Hết giờ" : `Bé chọn <b>${esc(c.chon)}</b>`}, đáp án <b>${esc(c.dapAn)}</b>.</li>`).join("")}</ul>

function xuat(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `hoc-toan-sao-luu-${khoaNgay(new Date())}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Đã xuất file sao lưu.");
}
document.getElementById("fileNhap").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d.hoSo !== "object") throw new Error();
      if (!confirm("Thay toàn bộ dữ liệu hiện tại bằng dữ liệu trong file này?")) return;
      DB = napDuLieu(d); luu(); apDungKhoa(); toast("Đã nhập dữ liệu."); manHome();
    } catch (err) { toast("File không đúng định dạng sao lưu."); }
  };
  r.readAsText(f);
  e.target.value = "";
});

/* =========================================================
   9. KHÓA GIAO DIỆN VÀ TOÀN MÀN HÌNH
   ========================================================= */
function dangToanMH(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function batToanMH(){
  const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!f){ toast("Trình duyệt này không hỗ trợ toàn màn hình. Trên iPhone, hãy dùng Chia sẻ → Thêm vào Màn hình chính."); return; }
  try { const r = f.call(el); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
function tatToanMH(){ const f = document.exitFullscreen || document.webkitExitFullscreen; if (f) try { f.call(document); } catch (e) {} }
function apDungKhoa(){
  document.body.classList.toggle("da-khoa", !!DB.khoa);
  const n = document.getElementById("nutKhoa");
  n.textContent = DB.khoa ? "🔒" : "🔓";
  n.setAttribute("aria-label", DB.khoa ? "Mở khóa giao diện" : "Khóa giao diện");
  n.title = n.getAttribute("aria-label");
}
document.getElementById("nutToanMH").addEventListener("click", () => dangToanMH() ? tatToanMH() : batToanMH());
document.getElementById("nutKhoa").addEventListener("click", () => {
  if (DB.khoa){
    hoiPhuHuynh(() => { DB.khoa = false; luu(); apDungKhoa(); toast("Đã mở khóa giao diện."); });
  } else {
    DB.khoa = true; luu(); apDungKhoa();
    if (!dangToanMH()) batToanMH();
    if (manHT === "phuhuynh") hoSo() ? manMap() : manHome();
    toast("Đã khóa giao diện. Bấm 🔒 và trả lời câu hỏi của phụ huynh để mở.");
  }
});
addEventListener("beforeunload", e => { if (DB.khoa){ e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("contextmenu", e => { if (DB.khoa) e.preventDefault(); });

/* =========================================================
   10. XỬ LÝ THAO TÁC
   ========================================================= */
function themHoSo(){
  const o = document.getElementById("tenMoi"), ten = o.value.trim();
  if (!ten){ toast("Nhập tên của bé trước nhé."); o.focus(); return; }
  const id = "hs" + Date.now();
  DB.hoSo[id] = chuanHoa({ id, ten, taoLuc: new Date().toISOString(), huyHieu: [] });
  DB.dangChon = id; luu(); manMap();
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-hd]");
  if (!b || b.disabled) return;
  const hd = b.dataset.hd, p = hoSo();
  switch (hd){
    case "chonHoSo": DB.dangChon = b.dataset.id; luu(); manMap(); break;
    case "themHoSo": themHoSo(); break;
    case "veHome":   manHome(); break;
    case "veMap":    manMap(); break;
    case "vePH":     manPhuHuynh(); break;
    case "moGD":     manBai(Number(b.dataset.k)); break;
    case "chonDoKho": p.doKho = Number(b.dataset.lv); luu(); manBai(K); break;
    case "lamBai":   batDau(K, Number(b.dataset.n)); break;
    case "thuKhoHon": p.doKho = Number(b.dataset.lv); luu(); batDau(K, Number(b.dataset.n)); break;
    case "lamKT":    batDau(K, 0); break;
    case "onCauSai":   batDauOn(cauTuNganHang(p), false); break;
    case "onCauSaiPH": batDauOn(cauTuNganHang(p), true); break;
    case "chon":     if (Q) xuLyTraLoi(Q.cau[Q.i].luaChon[Number(b.dataset.j)]); break;
    case "so":       goSo(b.dataset.d); break;
    case "xoaSo":    xoaSo(); break;
    case "nopSo":    nopSo(); break;
    case "nghe":     loiNgheNang = false; boNghe ? dungNghe() : batNghe(); break;
    case "tiep":     tiep(); break;
    case "docCau":   if (Q && !noi(Q.cau[Q.i].doc)) toast("Máy chưa có giọng đọc tiếng Việt."); break;
    case "thoatQuiz":
      if (confirm("Dừng bài này? Kết quả bài đang làm sẽ không được lưu.")){
        const q = Q; roiQuiz();
        if (q.loai === "on") q.tuPhuHuynh ? manPhuHuynh() : manMap(); else manBai(q.k);
      }
      break;
    case "phuHuynh": vaoPhuHuynh(); break;
    case "tabPH":    PH.tab = b.dataset.tab; manPhuHuynh(); break;
    case "xemThem":  PH.soDong += 30; manPhuHuynh(); break;
    case "onTuLuot": {
      const x = p.lichSu.find(l => l.id === b.dataset.id);
      if (x) batDauOn(x.sai.map(c => cauDeOn(c, x.k, x.lv)), true);
      break;
    }
    case "xoaLuot":
      if (confirm("Xóa lượt làm bài này khỏi lịch sử?")){ p.lichSu = p.lichSu.filter(l => l.id !== b.dataset.id); luu(); manPhuHuynh(); }
      break;
    case "xoaLichSu":
      if (confirm(`Xóa toàn bộ lịch sử làm bài của ${p.ten}? Tiến độ mở khóa, sao và cúp vẫn được giữ.`)){ p.lichSu = []; p.thongKeDang = {}; luu(); manPhuHuynh(); }
      break;
    case "xoaCau":   p.cauSai.splice(Number(b.dataset.i), 1); luu(); manPhuHuynh(); break;
    case "xoaHetCauSai":
      if (confirm("Xóa tất cả câu sai đang lưu?")){ p.cauSai = []; luu(); manPhuHuynh(); }
      break;
    case "docThu":   if (!noi("Xin chào. 3 cộng 4 bằng mấy?")) toast("Máy chưa có giọng đọc tiếng Việt."); break;
    case "thuMic":   thuMic(); break;
    case "themPhatAm": {
      const tu = document.getElementById("pamTu").value.trim(), doc = document.getElementById("pamDoc").value.trim();
      if (!tu || !doc){ toast("Nhập cả chữ hiển thị và cách đọc."); break; }
      DB.caiDat.phatAm = (DB.caiDat.phatAm || []).filter(r => r.tu.toLowerCase() !== tu.toLowerCase());
      DB.caiDat.phatAm.push({ tu, doc }); luu(); manPhuHuynh(); noi(tu); break;
    }
    case "xoaPhatAm": DB.caiDat.phatAm.splice(Number(b.dataset.i), 1); luu(); manPhuHuynh(); break;
    case "thuPhatAm": if (!noi(DB.caiDat.phatAm[Number(b.dataset.i)].tu)) toast("Máy chưa có giọng đọc tiếng Việt."); break;
    case "docCauThu": if (!noi(document.getElementById("pamThu").value)) toast("Máy chưa có giọng đọc tiếng Việt."); break;
    case "xuat":     xuat(); break;
    case "nhap":     document.getElementById("fileNhap").click(); break;
    case "xoaHoSo":
      if (p && confirm(`Xóa toàn bộ tiến độ của ${p.ten}? Không thể hoàn tác.`)){ delete DB.hoSo[p.id]; DB.dangChon = null; luu(); toast("Đã xóa hồ sơ."); manHome(); }
      break;
  }
});

app.addEventListener("change", e => {
  const id = e.target.id, p = hoSo();
  if (id === "caiAmThanh"){ DB.caiDat.amThanh = e.target.checked; luu(); }
  if (id === "caiTuDoc"){ DB.caiDat.tuDoc = e.target.checked; luu(); }
  if (id === "caiGiong"){ DB.caiDat.giong = e.target.value; luu(); }
  if (id === "caiTocDo"){ DB.caiDat.tocDo = parseFloat(e.target.value); luu(); }
  if (id === "caiTraLoiGiong"){ DB.caiDat.traLoiGiong = e.target.checked; luu(); }
  if (id === "caiNgheTuDong"){ DB.caiDat.ngheTuDong = e.target.checked; luu(); }
  if (id === "caiMoKhoa" && p){ p.moKhoaTatCa = e.target.checked; luu(); toast(p.moKhoaTatCa ? "Đã mở khóa tất cả." : "Đã khóa lại theo tiến độ."); }
  if (id === "caiDoKhoKT" && p){ p.doKhoKiemTra = Number(e.target.value); luu(); }
  if (id === "phHoSo"){ DB.dangChon = e.target.value; luu(); PH.soDong = 30; manPhuHuynh(); }
  if (id === "locGD"){ PH.locGD = e.target.value; PH.soDong = 30; manPhuHuynh(); }
  if (id === "locLoai"){ PH.locLoai = e.target.value; PH.soDong = 30; manPhuHuynh(); }
});

document.addEventListener("keydown", e => {
  if (e.target.id === "tenMoi" && e.key === "Enter"){ themHoSo(); return; }
  if (!Q || Q.daTraLoi || document.querySelector(".cm") || ["INPUT", "SELECT"].includes(e.target.tagName)) return;
  const c = Q.cau[Q.i];
  if (c.nhapSo){
    if (/^[0-9]$/.test(e.key)) goSo(e.key);
    else if (e.key === "Backspace") xoaSo();
    else if (e.key === "Enter"){ e.preventDefault(); nopSo(); }
  } else if ([">", "<", "="].includes(e.key) && c.luaChon.includes(e.key)) xuLyTraLoi(e.key);
});

if ("speechSynthesis" in window){
  speechSynthesis.getVoices();
  speechSynthesis.addEventListener("voiceschanged", () => { if (manHT === "phuhuynh" && PH.tab === "caiDat") manPhuHuynh(); });
}

/* Khởi động */
hienCanhBao();
apDungKhoa();
if (hoSo()) manMap(); else manHome();
</script>
</body>
</html>
